# =============================================================================
# TellMe — Example Configuration File
# =============================================================================
# PURPOSE:
#   This file documents every configurable property.
#   Copy to application-local.properties and fill in real values.
#   Never commit application-local.properties to version control.
#
# USAGE:
#   Option A (Environment Variables) — recommended for production:
#     Set each ${ENV_VAR} as a real environment variable.
#
#   Option B (Local Properties) — recommended for development:
#     Create src/main/resources/application-local.properties
#     and override properties there.
# =============================================================================

# ---------------------------------------------------------------------------
# DATABASE
# ---------------------------------------------------------------------------
# Full JDBC URL. For MySQL 8+, include serverTimezone=UTC.
DB_URL=jdbc:mysql://localhost:3306/tellme_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# MySQL username
DB_USERNAME=root

# MySQL password (leave empty for passwordless local dev)
DB_PASSWORD=

# DDL strategy: update | validate | create | create-drop | none
# Use 'validate' in production and manage schema with Flyway or Liquibase.
JPA_DDL_AUTO=update

# Show generated SQL in logs (true for debug, false for production)
JPA_SHOW_SQL=false

# ---------------------------------------------------------------------------
# EMAIL (SMTP)
# ---------------------------------------------------------------------------
# SMTP server hostname
MAIL_HOST=smtp.gmail.com

# SMTP port (587 for TLS, 465 for SSL)
MAIL_PORT=587

# Your sender email address
MAIL_USERNAME=your-email@gmail.com

# For Gmail: use an App Password (not your account password).
# Generate at: https://myaccount.google.com/apppasswords
MAIL_PASSWORD=xxxx-xxxx-xxxx-xxxx

# The address shown in the From: header
MAIL_FROM=TellMe Platform <your-email@gmail.com>

# ---------------------------------------------------------------------------
# EMAIL ROUTING
# ---------------------------------------------------------------------------
# When a submission belongs to the 'Organisasi' category, this email receives it.
MAIL_ROUTING_ORGANISASI=student-org@example.com

# When a submission belongs to the 'Akademik' category, this email receives it.
MAIL_ROUTING_AKADEMIK=academic-office@example.com

# ---------------------------------------------------------------------------
# FILE UPLOADS
# ---------------------------------------------------------------------------
# Directory where uploaded files are stored (relative to working directory)
UPLOAD_DIR=uploads

# Maximum number of files per upload request
UPLOAD_MAX_FILES=5

# Maximum size per file
MAX_FILE_SIZE=5MB

# Maximum total request size
MAX_REQUEST_SIZE=25MB

# ---------------------------------------------------------------------------
# SERVER
# ---------------------------------------------------------------------------
SERVER_PORT=8081

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
# Allowed origins for Cross-Origin requests.
# Use http://localhost:8081 for local dev.
# For production, set to your actual domain: https://yourapp.university.ac.id
CORS_ALLOWED_ORIGINS=http://localhost:8081

# ---------------------------------------------------------------------------
# FLYWAY (Database Migrations)
# ---------------------------------------------------------------------------
# NEW INSTALLATIONS: set FLYWAY_ENABLED=true and JPA_DDL_AUTO=validate
# EXISTING INSTALLATIONS: set FLYWAY_ENABLED=true and FLYWAY_BASELINE_ON_MIGRATE=true
FLYWAY_ENABLED=false
FLYWAY_BASELINE_ON_MIGRATE=false
FLYWAY_BASELINE_VERSION=0

# ---------------------------------------------------------------------------
# OPENAPI / SWAGGER UI
# ---------------------------------------------------------------------------
# Set to false to disable Swagger docs in production
SWAGGER_ENABLED=true

