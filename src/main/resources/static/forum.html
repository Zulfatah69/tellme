<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe — Forum</title>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root{
            --ink:#0d0d0d;
            --paper:#f7f4ee;
            --accent:#ff4d2e;
            --accent2:#1a1aff;
            --muted:#8f8f82;
            --border:#e3dfd6;
            --card:#ffffff;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'DM Sans',sans-serif;
            background:var(--paper);
            color:var(--ink);
            min-height:100vh;
            overflow-x:hidden;
        }

        body::before{
            content:'';
            position:fixed;
            inset:0;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255,77,46,0.07) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(26,26,255,0.06) 0%, transparent 40%);
            pointer-events:none;
            z-index:0;
        }

        body::after{
            content:'';
            position:fixed;
            inset:0;
            background-image:
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size:28px 28px;
            pointer-events:none;
            z-index:0;
        }

        /* NAVBAR */

        nav{
            position:sticky;
            top:0;
            z-index:100;
            height:64px;
            padding:0 2rem;
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(13,13,13,0.82);
            backdrop-filter:blur(14px);
            border-bottom:1px solid rgba(255,255,255,0.05);
        }

        .nav-brand{
            font-family:'Syne',sans-serif;
            font-size:1.4rem;
            font-weight:800;
            color:white;
            text-decoration:none;
            letter-spacing:-0.04em;
        }

        .nav-brand span{
            color:var(--accent);
        }

        .nav-links{
            display:flex;
            align-items:center;
            gap:.25rem;
            list-style:none;
        }

        .nav-links a{
            text-decoration:none;
            color:#999;
            font-size:.84rem;
            padding:.45rem .8rem;
            border-radius:8px;
            transition:.2s;
        }

        .nav-links a:hover,
        .nav-links a.active{
            background:rgba(255,255,255,0.08);
            color:white;
        }

        .nav-links a.active{
            color:var(--accent);
        }

        .nav-right{
            display:flex;
            align-items:center;
            gap:1rem;
        }

        .nav-greeting{
            font-size:.82rem;
            color:#777;
        }

        .nav-greeting strong{
            color:white;
            font-weight:500;
        }

        .btn-logout{
            border:none;
            background:var(--accent);
            color:var(--ink);
            font-family:'Syne',sans-serif;
            font-size:.72rem;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:.08em;
            padding:.55rem 1rem;
            border-radius:8px;
            cursor:pointer;
            transition:.2s;
        }

        .btn-logout:hover{
            transform:translateY(-2px);
            opacity:.9;
        }

        /* MAIN */

        main{
            position:relative;
            z-index:1;
            max-width:850px;
            margin:auto;
            padding:4rem 1.2rem 5rem;
        }

        .page-header{
            margin-bottom:3rem;
            animation:fadeUp .5s ease forwards;
        }

        .eyebrow{
            font-family:'Syne',sans-serif;
            font-size:.72rem;
            font-weight:800;
            letter-spacing:.15em;
            text-transform:uppercase;
            color:var(--accent);
            margin-bottom:.8rem;
            display:flex;
            align-items:center;
            gap:.5rem;
        }

        .eyebrow::before{
            content:'';
            width:24px;
            height:2px;
            background:var(--accent);
        }

        .page-title{
            font-family:'Syne',sans-serif;
            font-size:clamp(2.4rem,6vw,4rem);
            line-height:1;
            letter-spacing:-0.05em;
            font-weight:800;
        }

        .page-title em{
            color:var(--accent2);
            font-style:normal;
        }

        .page-subtitle{
            margin-top:1rem;
            max-width:500px;
            color:var(--muted);
            line-height:1.7;
            font-size:.95rem;
            font-weight:300;
        }

        /* CARD */

        .card{
            position:relative;
            background:rgba(255,255,255,0.8);
            backdrop-filter:blur(12px);
            border:1.5px solid var(--border);
            border-radius:22px;
            padding:2rem;
            overflow:hidden;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.05),
                0 2px 10px rgba(0,0,0,0.04);
            margin-bottom:1.5rem;
            animation:fadeUp .5s ease forwards;
        }

        .card::before{
            content:'';
            position:absolute;
            top:0;
            left:0;
            right:0;
            height:3px;
            background:linear-gradient(90deg,var(--accent),var(--accent2));
        }

        .field-label{
            font-family:'Syne',sans-serif;
            font-size:.72rem;
            text-transform:uppercase;
            letter-spacing:.1em;
            color:var(--muted);
            margin-bottom:.7rem;
            display:block;
        }

        textarea{
            width:100%;
            border:none;
            outline:none;
            resize:none;
            border-radius:14px;
            background:var(--paper);
            border:1.5px solid var(--border);
            padding:1rem 1.2rem;
            font-family:'DM Sans',sans-serif;
            font-size:.95rem;
            line-height:1.7;
            color:var(--ink);
            transition:.2s;
            box-shadow:inset 0 1px 2px rgba(0,0,0,0.04);
        }

        textarea:focus{
            border-color:var(--accent2);
            box-shadow:0 0 0 3px rgba(26,26,255,0.08);
        }

        textarea::placeholder{
            color:#bbb;
        }

        .btn-primary{
            width:100%;
            border:none;
            background:var(--ink);
            color:white;
            padding:1rem;
            border-radius:14px;
            font-family:'Syne',sans-serif;
            font-weight:700;
            font-size:.95rem;
            cursor:pointer;
            transition:.25s;
            margin-top:1rem;
            position:relative;
            overflow:hidden;
            box-shadow:
                0 10px 20px rgba(255,77,46,0.15),
                0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-primary::before{
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(90deg,var(--accent),var(--accent2));
            opacity:0;
            transition:.3s;
        }

        .btn-primary span{
            position:relative;
            z-index:1;
        }

        .btn-primary:hover::before{
            opacity:1;
        }

        .btn-primary:hover{
            transform:translateY(-2px);
        }

        /* POST */

        .post-top{
            display:flex;
            justify-content:space-between;
            gap:1rem;
        }

        .user-name{
            font-family:'Syne',sans-serif;
            font-weight:700;
            font-size:1rem;
        }

        .post-date{
            font-size:.76rem;
            color:var(--muted);
            margin-top:.2rem;
        }

        .btn-delete{
            border:none;
            background:#ffe4df;
            color:var(--accent);
            padding:.55rem .9rem;
            border-radius:10px;
            cursor:pointer;
            font-size:.76rem;
            font-weight:700;
            transition:.2s;
            height:fit-content;
        }

        .btn-delete:hover{
            background:var(--accent);
            color:white;
        }

        .divider{
            height:1px;
            background:var(--border);
            margin:1.4rem 0;
        }

        .post-content{
            font-size:.97rem;
            line-height:1.8;
            color:#222;
            white-space:pre-wrap;
        }

        /* COMMENT */

        .comment-box{
            background:#f8f6f1;
            border:1px solid var(--border);
            border-radius:16px;
            padding:1rem;
            margin-top:1rem;
        }

        .comment-header{
            display:flex;
            justify-content:space-between;
            gap:1rem;
        }

        .comment-content{
            margin-top:.8rem;
            line-height:1.7;
            font-size:.92rem;
        }

        .comment-input{
            margin-top:1.5rem;
        }

        .btn-comment{
            border:none;
            background:var(--accent2);
            color:white;
            padding:.7rem 1rem;
            border-radius:10px;
            margin-top:.8rem;
            cursor:pointer;
            font-size:.8rem;
            font-weight:700;
            transition:.2s;
        }

        .btn-comment:hover{
            transform:translateY(-2px);
        }

        .blob{
            position:fixed;
            border-radius:50%;
            filter:blur(90px);
            opacity:.16;
            pointer-events:none;
            z-index:0;
        }

        .blob1{
            width:250px;
            height:250px;
            background:var(--accent);
            top:-80px;
            right:-80px;
        }

        .blob2{
            width:230px;
            height:230px;
            background:var(--accent2);
            bottom:-80px;
            left:-80px;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:768px){

            nav{
                padding:0 1rem;
            }

            .nav-links{
                display:none;
            }

            .card{
                padding:1.4rem;
            }

            .page-title{
                font-size:2.8rem;
            }

        }

        .reply-box{
            margin-left:40px;
            border-left:3px solid #dee2e6;
            padding-left:15px;
            margin-top:10px;
        }

    </style>
</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
    window.location.href = "/login.html";
}

window.onload = function(){

    const namaElements =
        document.querySelectorAll(".namaUser");

    namaElements.forEach(el => {
        el.innerText = user.nama;
    });
}

</script>

<nav>

    <a href="#" class="nav-brand">
        Tell<span>Me</span>
    </a>

    <ul class="nav-links">

        <li>
            <a href="/index.html">
                Beranda
            </a>
        </li>

        <li>
            <a href="/aspirasi.html">
                Buat Aspirasi
            </a>
        </li>

        <li>
            <a href="/forum.html" class="active">
                Forum
            </a>
        </li>

        <li>
            <a href="/riwayat.html">
                Riwayat
            </a>
        </li>

        <li>
            <a href="/profile.html">
                Profile
            </a>
        </li>

    </ul>

    <div class="nav-right">

            <span class="me-3">
                Halo, <span id="namaUser"></span>
            </span>

        <button
            class="btn-logout"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>

<main>

    <div class="page-header">

        <div class="eyebrow">
            Diskusi Publik
        </div>

        <h1 class="page-title">
            Forum<br>
            <em>TellMe</em>
        </h1>

        <p class="page-subtitle">
            Bagikan opini, ide, dan diskusi bersama pengguna lainnya secara terbuka.
        </p>

    </div>

    <div class="card">

        <label class="field-label">
            Buat Postingan
        </label>

        <textarea
            id="isiPost"
            rows="4"
            placeholder="Apa yang sedang kamu pikirkan?"></textarea>

        <button
            class="btn-primary"
            onclick="buatPost()">

            <span>Posting Sekarang</span>

        </button>

    </div>

    <div id="listPost"></div>

        </div>

    </div>

</div>

<script>

const POST_API =
    "http://localhost:8080/api/forum";

const COMMENT_API =
    "http://localhost:8080/api/forum-comment";

let currentPostId = null;

function logout(){

    localStorage.removeItem("user");

    window.location.href = "/login.html";
}

async function loadPost(){

    const res = await fetch(POST_API);

    const data = await res.json();

    let html = "";

    data.reverse().forEach(post => {

        html += `

        <div class="card">

            <div class="post-top">

                <div>

                    <div class="user-name">
                        ${post.user?.nama}
                    </div>

                    <div class="post-date">
                        ${formatTanggal(post.tanggal)}
                    </div>

                </div>

                ${post.user?.id == user.id || user.role == 'ADMIN' ? `

                    <button
                        class="btn-delete"
                        onclick="hapusPost(${post.id})">

                        Hapus

                    </button>

                ` : ''}

            </div>

            <div class="divider"></div>

            <div class="post-content">
                ${post.isiPost}
            </div>

                <div class="mt-3">

                    <textarea
                        id="komentar-${post.id}"
                        class="form-control mb-2"
                        rows="2"
                        placeholder="Tulis komentar..."></textarea>

                    <button
                        class="btn btn-sm btn-primary"
                        onclick="kirimKomentar(${post.id})">

                        Kirim Komentar

                </button>

                </div>

                <div
                    id="comment-list-${post.id}"
                    class="mt-3"></div>

            </div>

        </div>

        `;
    });

    document.getElementById("listPost").innerHTML =
        html;
}

async function bukaDiskusi(postId){

    currentPostId = postId;

    const modal =
        new bootstrap.Modal(
            document.getElementById("diskusiModal")
        );

    modal.show();

    loadKomentar(postId);
}

async function loadKomentar(postId){

    const res =
        await fetch(`${COMMENT_API}/${postId}`);

    const data = await res.json();

    let html = `

        <textarea
            id="komentarUtama"
            class="form-control mb-2"
            placeholder="Tulis komentar..."></textarea>

        <button
            class="btn btn-primary btn-sm mb-4"
            onclick="kirimKomentar()">

            Kirim Komentar

        </button>

    `;

    if(data.length === 0){

        html += `

            <div class="text-center text-muted">

                Belum ada komentar

            </div>

        `;
    }

    data.forEach(comment => {

        html += renderComment(comment,0);

    });

    document.getElementById(
        "modalKomentar"
    ).innerHTML = html;
}

function renderComment(comment, level){

    let marginLeft = level * 30;

    let html = `

    <div
        class="comment-box"
        style="margin-left:${marginLeft}px">

        <div class="d-flex justify-content-between">

            <div>

                <strong>
                    ${comment.namaUser}
                </strong>

                <br>

                <small class="text-muted">
                    ${formatTanggal(comment.tanggal)}
                </small>

            </div>

            ${comment.userId == user.id || user.role == 'ADMIN' ? `

                <button
                    class="btn btn-danger btn-sm"
                    onclick="hapusKomentar(${comment.id})">

                    Hapus

                </button>

            ` : ''}

        </div>

        <p class="mt-2">
            ${comment.isiKomentar}
        </p>

        <div class="d-flex gap-3">

            <button
                class="btn btn-link btn-sm p-0"
                onclick="showReply(${comment.id})">

                Balas

            </button>

            <small class="text-muted">

                ${comment.totalReply} balasan

            </small>

        </div>

        <div
            id="reply-form-${comment.id}"
            class="mt-2"></div>

    `;

    if(comment.replies && comment.replies.length > 0){

        comment.replies.forEach(reply => {

            html += renderComment(
                reply,
                level + 1
            );

        });
    }

    html += `</div>`;

    return html;
}

function showReply(commentId){

    document.getElementById(
        `reply-form-${commentId}`
    ).innerHTML = `

        <textarea
            id="reply-${commentId}"
            class="form-control mb-2"
            placeholder="Tulis balasan..."></textarea>

        <button
            class="btn btn-primary btn-sm"
            onclick="kirimReply(${commentId})">

            Kirim Balasan

        </button>

    `;
}

async function kirimKomentar(){

    const isiKomentar =
        document.getElementById(
            "komentarUtama"
        ).value;

    if(!isiKomentar) return;

    await fetch(COMMENT_API,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            isiKomentar:isiKomentar,

            post:{
                id:currentPostId
            },

            user:{
                id:user.id
            }

        })

    });

    loadKomentar(currentPostId);
}

async function kirimReply(commentId){

    const isiKomentar =
        document.getElementById(
            `reply-${commentId}`
        ).value;

    if(!isiKomentar) return;

    await fetch(COMMENT_API,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            isiKomentar:isiKomentar,

            post:{
                id:currentPostId
            },

            user:{
                id:user.id
            },

            parentComment:{
                id:commentId
            }

        })

    });

    loadKomentar(currentPostId);
}

async function buatPost(){

    const isiPost =
        document.getElementById("isiPost").value;

    if(!isiPost){

        alert("Isi postingan dulu");

        return;
    }

    await fetch(POST_API,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            isiPost:isiPost,

            user:{
                id:user.id
            }

        })

    });

    document.getElementById("isiPost").value = "";

    loadPost();
}

async function hapusPost(id){

    if(!confirm("Hapus postingan?")) return;

    await fetch(`${POST_API}/${id}`,{
        method:"DELETE"
    });

    loadPost();
}

async function kirimKomentar(postId){

    const isiKomentar =
        document.getElementById(
            `komentar-${postId}`
        ).value;

    if(!isiKomentar){

        alert("Isi komentar dulu");

        return;
    }

    await fetch(COMMENT_API,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            isiKomentar:isiKomentar,

            post:{
                id:postId
            },

            user:{
                id:user.id
            }

        })

    });

    document.getElementById(
        `komentar-${postId}`
    ).value = "";

    loadKomentar(postId);
}

async function loadKomentar(postId){

    const res =
        await fetch(`${COMMENT_API}/${postId}`);

    const data = await res.json();

    let html = "";

    data.forEach(comment => {

        html += `

        <div class="comment-box">

            <div class="d-flex justify-content-between">

                <div>

                    <strong>
                        ${comment.user?.nama}
                    </strong>

                    <br>

                    <small class="text-muted">
                        ${formatTanggal(comment.tanggal)}
                    </small>

                </div>

                ${comment.user?.id == user.id || user.role == 'ADMIN' ? `

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="hapusKomentar(${comment.id}, ${postId})">

                        Hapus

                    </button>

                ` : ''}

            </div>

            <hr>

            <p class="mb-0">
                ${comment.isiKomentar}
            </p>

        </div>

        `;
    });

    document.getElementById(
        `comment-list-${postId}`
    ).innerHTML = html;
}

async function hapusKomentar(id, postId){

    if(!confirm("Hapus komentar?")) return;

    await fetch(`${COMMENT_API}/${id}`,{
        method:"DELETE"
    });

    loadKomentar(currentPostId);
}

function formatTanggal(tanggal){

    return new Date(tanggal)
        .toLocaleString("id-ID");
}

loadPost();

</script>

</body>
</html>
