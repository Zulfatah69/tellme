<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe - Forum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ── LIGHT THEME ── */
        :root,
        [data-theme="light"] {
            --navy: #0f1f3d;
            --teal: #0e9f8e;
            --teal-light: #12b5a2;
            --teal-glow: rgba(14,159,142,0.18);
            --cream: #f7f6f2;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f0f2f7;
            --bg2: #e8eaf0;
            --surface: #ffffff;
            --surface2: #f3f4f6;
            --surface3: #eceef3;
            --text: #1f2937;
            --text-soft: #374151;
            --nav-bg: rgba(255,255,255,0.88);
            --nav-shadow: 0 1px 0 rgba(15,31,61,0.08);
            --hero-gradient: linear-gradient(135deg, #0f1f3d 0%, #1a3560 55%, #0e3050 100%);
            --hero-border: rgba(255,255,255,0.07);
            --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
            --card-hover-shadow: 0 4px 20px rgba(0,0,0,0.1);
            --toggle-track: #dde0e8;
            --toggle-thumb: #0e9f8e;
            --toggle-pos: 2px;
            --stat-color: #0e9f8e;
            --sidebar-divider: rgba(15,31,61,0.08);
        }

        /* ── DARK THEME ── */
        [data-theme="dark"] {
            --navy: #e2e8f0;
            --teal: #2dd4bf;
            --teal-light: #5eead4;
            --teal-glow: rgba(45,212,191,0.12);
            --cream: #10121d;
            --muted: #8892a4;
            --border: rgba(255,255,255,0.07);
            --bg: #10121d;
            --bg2: #0d0f18;
            --surface: #1b1f31;
            --surface2: #222640;
            --surface3: #191c2d;
            --text: #e8eaf6;
            --text-soft: #a8b2c8;
            --nav-bg: rgba(16,18,29,0.92);
            --nav-shadow: 0 1px 0 rgba(255,255,255,0.05);
            --hero-gradient: linear-gradient(135deg, #0d1025 0%, #111630 55%, #0a1428 100%);
            --hero-border: rgba(45,212,191,0.1);
            --card-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 4px 24px rgba(0,0,0,0.35);
            --card-hover-shadow: 0 0 0 1px rgba(45,212,191,0.15), 0 8px 32px rgba(0,0,0,0.4);
            --toggle-track: #1e2235;
            --toggle-thumb: #6c63ff;
            --toggle-pos: 24px;
            --stat-color: #2dd4bf;
            --sidebar-divider: rgba(255,255,255,0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            margin: 0;
            color: var(--text);
            transition: background 0.35s ease, color 0.35s ease;
            min-height: 100vh;
        }

        /* ── NAV ── */
        .tm-nav {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            box-shadow: var(--nav-shadow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: background 0.35s ease, border-color 0.35s ease;
        }
        .tm-nav .inner {
            display: flex; align-items: center; height: 60px;
            max-width: 1280px; margin: auto; padding: 0 28px; gap: 0;
        }
        .tm-brand {
            font-family: 'Sora', sans-serif; font-size: 1.3rem; font-weight: 800;
            color: var(--text); text-decoration: none; letter-spacing: -0.03em;
            margin-right: 36px; flex-shrink: 0;
            transition: color 0.35s ease;
        }
        .tm-brand span { color: var(--teal); }
        .tm-links { display: flex; align-items: center; gap: 1px; flex: 1; }
        .tm-links a {
            color: var(--muted); text-decoration: none; font-size: 0.85rem;
            font-weight: 500; padding: 6px 12px; border-radius: 8px;
            transition: color 0.15s, background 0.15s; white-space: nowrap;
            letter-spacing: 0.01em;
        }
        .tm-links a:hover { color: var(--text); background: rgba(255,255,255,0.05); }
        .tm-links a.active {
            color: var(--teal);
            background: var(--teal-glow);
            font-weight: 600;
        }
        [data-theme="light"] .tm-links a:hover { background: var(--surface3); }

        .tm-user { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .tm-hello { font-size: 0.83rem; color: var(--muted); transition: color 0.35s ease; }
        .tm-hello strong { color: var(--text); font-weight: 600; transition: color 0.35s ease; }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px; padding: 5px 13px; font-size: 0.8rem;
            font-weight: 600; color: var(--muted); cursor: pointer;
            transition: all 0.15s; font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.01em;
        }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

        /* ── THEME TOGGLE ── */
        .theme-toggle {
            display: flex; align-items: center; gap: 7px;
            cursor: pointer; user-select: none; flex-shrink: 0;
        }
        .theme-toggle-label {
            font-size: 0.78rem; font-weight: 600; color: var(--muted);
            transition: color 0.2s; white-space: nowrap; letter-spacing: 0.02em;
        }
        .toggle-track {
            position: relative; width: 44px; height: 22px;
            background: var(--toggle-track);
            border: 1px solid var(--border);
            border-radius: 100px;
            transition: all 0.3s ease; flex-shrink: 0;
        }
        .toggle-thumb {
            position: absolute; top: 2px; left: var(--toggle-pos);
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--toggle-thumb);
            transition: left 0.3s cubic-bezier(.34,1.56,.64,1), background 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.55rem;
        }

        /* ── PAGE WRAP ── */
        .page-wrap { max-width: 800px; margin: 0 auto; padding: 32px 28px; }
        
        .page-header { margin-bottom: 24px; }
        .page-header h2 { font-family: 'Sora', sans-serif; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
        .page-header p { color: var(--muted); font-size: 0.88rem; margin: 0; }

        /* ── CARDS & FORMS ── */
        .card-tm {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }
        .card-tm .card-body { padding: 22px 26px; }

        .card-tm h6 { font-family: 'Sora', sans-serif; font-size: 0.92rem; font-weight: 700; margin-bottom: 12px; }
        
        .form-control {
            border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px;
            font-size: 0.9rem; color: var(--text); background: var(--surface2);
            width: 100%; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
        }
        .form-control:focus {
            border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-glow);
            outline: none; background: var(--surface); color: var(--text);
        }
        textarea.form-control { resize: none; }

        .btn-post {
            background: var(--teal); color: #fff; border: none; border-radius: 8px;
            padding: 9px 20px; font-family: 'Sora', sans-serif; font-weight: 600;
            font-size: 0.85rem; cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        .btn-post:hover { background: var(--teal-light); }

        /* ── POST CARD SPECIFIC ── */
        .post-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .post-user { display: flex; align-items: center; gap: 10px; }
        
        .avatar {
            width: 36px; height: 36px; border-radius: 50%; background: var(--surface3);
            color: var(--teal); display: flex; align-items: center; justify-content: center;
            font-family: 'Sora', sans-serif; font-size: 0.78rem; font-weight: 700; flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .post-name { font-family: 'Sora', sans-serif; font-size: 0.88rem; font-weight: 700; color: var(--text); }
        .post-date { font-size: 0.74rem; color: var(--muted); }
        
        .btn-del {
            background: transparent; border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; color: #ef4444;
            cursor: pointer; transition: all 0.15s; font-weight: 500;
        }
        .btn-del:hover { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; }

        .post-body { font-size: 0.9rem; color: var(--text-soft); line-height: 1.6; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .post-footer { padding-top: 16px; background: transparent; }

        /* ── COMMENTS SYSTEM ── */
        .comment-input-row { display: flex; gap: 8px; margin-bottom: 16px; }
        .comment-input-row .form-control { flex: 1; }
        
        .btn-comment {
            background: transparent; border: 1px solid var(--teal); border-radius: 8px;
            padding: 8px 16px; font-size: 0.8rem; font-weight: 600; color: var(--teal);
            cursor: pointer; white-space: nowrap; transition: all 0.15s;
        }
        .btn-comment:hover { background: var(--teal); color: #fff; }

        .comment-item { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
        .comment-item:first-child { border-top: none; }
        
        .comment-avatar {
            width: 28px; height: 28px; border-radius: 50%; background: var(--surface2);
            color: var(--teal); display: flex; align-items: center; justify-content: center;
            font-family: 'Sora', sans-serif; font-size: 0.68rem; font-weight: 700; flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .comment-body { flex: 1; }
        .comment-meta { display: flex; align-items: center; justify-content: space-between; }
        .comment-name { font-family: 'Sora', sans-serif; font-size: 0.81rem; font-weight: 700; color: var(--text); }
        .comment-actions { display: flex; gap: 10px; align-items: center; }
        
        .btn-reply-link, .comment-del {
            background: transparent; border: none; font-size: 0.72rem; font-weight: 600;
            color: var(--muted); cursor: pointer; padding: 0; transition: color 0.15s;
        }
        .btn-reply-link:hover { color: var(--teal); }
        .comment-del:hover { color: #ef4444; }
        
        .comment-text { font-size: 0.85rem; color: var(--text-soft); line-height: 1.5; margin-top: 3px; }
        .mention-tag { color: var(--teal) !important; font-weight: 600; }

        /* ── EMPTY STATE ── */
        .empty-state { text-align: center; padding: 56px 24px; }
        .empty-state h4 { font-family: 'Sora', sans-serif; font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .empty-state p { font-size: 0.84rem; color: var(--muted); margin: 0; }
    </style>
</head>
<body>

<script>
(function() {
    const saved = localStorage.getItem('tellme-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
})();
</script>

<script>
const user = JSON.parse(localStorage.getItem("user") || '{"nama":"Byantara","role":"MAHASISWA"}');
if(!user) window.location.href = "/login.html";

window.onload = function() {

    document
        .querySelectorAll(".namaUser")
        .forEach(el =>
            el.innerText = user.nama
        );

    applyThemeUI(
        document.documentElement
        .getAttribute('data-theme')
        || 'dark'
    );

    loadPost();
}
    document.querySelectorAll(".namaUser").forEach(el => el.innerText = user.nama);
    applyThemeUI(document.documentElement.getAttribute('data-theme') || 'dark');
    loadPost();
</script>

<nav class="tm-nav">
    <div class="inner">
        <a class="tm-brand" href="/index.html">Tell<span>Me</span></a>
        <div class="tm-links">
            <a href="/index.html">Beranda</a>
            <a href="/aspirasi.html">Buat Aspirasi</a>
            <a href="/forum.html" class="active">Forum</a>
            <a href="/profile.html">Profil</a>
        </div>
        <div class="tm-user">
            <div class="theme-toggle" onclick="toggleTheme()" title="Ganti tema">
                <div class="toggle-track">
                    <div class="toggle-thumb" id="toggleThumb">
                        <span id="toggleIcon">🌙</span>
                    </div>
                </div>
                <span class="theme-toggle-label" id="themeLabel">Gelap</span>
            </div>
            <div class="tm-hello">Halo, <strong class="namaUser"></strong></div>
            <button class="btn-logout" onclick="logout()">Keluar</button>
        </div>
    </div>
</nav>

<div class="page-wrap">
    <div class="page-header">
        <h2>Forum Diskusi</h2>
        <p>Diskusi bebas dengan sesama mahasiswa.</p>
    </div>

    <!-- Tulis Postingan -->
    <div class="card-tm">
        <div class="card-body">
            <h6>💬 Apa yang sedang kamu pikirkan?</h6>
            <textarea id="isiPost" class="form-control" rows="3" placeholder="Tulis postingan kamu..."></textarea>
            <div class="text-end">
                <button class="btn-post" onclick="buatPost()">Posting →</button>
            </div>
        </div>
    </div>

    <!-- Wrapper List Post -->
    <div id="listPost">
        <p style="text-align:center; color:var(--muted); padding:40px 0;">Memuat forum...</p>
    </div>
</div>

<script>
const POST_API = "http://localhost:8080/api/forum";
const COMMENT_API = "http://localhost:8080/api/forum-comment";
let currentReplyUser = null;

function logout() { localStorage.removeItem("user"); window.location.href = "/login.html"; }

function applyThemeUI(theme) {
    const isLight = theme === 'light';
    document.getElementById('themeLabel').textContent = isLight ? 'Terang' : 'Gelap';
    document.getElementById('toggleIcon').textContent  = isLight ? '☀️' : '🌙';
}

function toggleTheme() {
    const html    = document.documentElement;
    const current = html.getAttribute('data-theme') || 'dark';
    const next    = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tellme-theme', next);
    applyThemeUI(next);
}

function formatTgl(t) {
    if (!t) return '';
    return new Date(t).toLocaleDateString("id-ID", { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function initial(nama) {
    return (nama || "M")
        .charAt(0)
        .toUpperCase();
}

function balasKomentar(postId, namaUser) {

    const inputKomentar =
        document.getElementById(
            `komentar-${postId}`
        );

    currentReplyUser =
        namaUser;

    inputKomentar.value =
        `@${namaUser} `;

    inputKomentar.focus();
}

// Menghias teks jika mendeteksi adanya @mention balasan
function formatKomentarTeks(teks) {
    if(teks.startsWith('@')) {
        const parts = teks.split(' ');
        const mention = parts.shift();
        return `<span class="mention-tag">${mention}</span> ${parts.join(' ')}`;
    }
    return teks;
}

async function loadPost() {
    try {
        const res = await fetch(POST_API); 
        const data = await res.json();
        let html = "";
        
        if (!data.length) {
            document.getElementById("listPost").innerHTML = `
                <div class="card-tm empty-state">
                    <h4>Belum ada postingan</h4>
                    <p>Jadilah yang pertama memulai diskusi di forum ini.</p>
                </div>`;
            return;
        }

        data.forEach(post => {
            const canDel = post.user?.id == user.id || user.role == 'ADMIN';
        html += `

        <div
            style="
                margin-bottom:20px;
            ">

            <div
                class="card-tm"
                id="post-${post.id}"

                style="
                    background:var(--surface);
                    border-radius:22px;
                    padding:24px;

                    border:1px solid var(--border);

                    box-shadow:
                        0 8px 28px rgba(0,0,0,0.06);
                ">

                <div class="post-header">

                    <div class="post-user">

                        <div class="avatar">

                            ${initial(post.user?.nama)}

                        </div>

                        <div>

                            <div class="post-name">

                                ${post.user?.nama || 'Mahasiswa'}

                            </div>

                            <div class="post-date">

                                ${formatTgl(post.tanggal)}

                            </div>

                        </div>

                    </div>

                    ${canDel
                        ? `
                        <button
                            class="btn-del"
                            onclick="hapusPost(${post.id})">

                            Hapus

                        </button>
                        `
                        : ''
                    }

                </div>

                <div class="post-body">

                    ${post.isiPost}

                </div>

                <div class="post-footer">

                    <button
                        class="btn-comment"
                        onclick="toggleKomentar(${post.id})">

                        Lihat Diskusi

                    </button>

                    <div
                        id="komentar-wrapper-${post.id}"
                        style="
                            display:none;
                            margin-top:24px;
                        ">

                        <div
                            style="
                                background:var(--surface2);
                                border:1px solid var(--border);

                                border-radius:18px;

                                padding:20px;
                            ">

                            <div
                                style="
                                    font-weight:700;
                                    margin-bottom:18px;
                                ">

                                Diskusi

                            </div>

                            <div
                                id="comment-list-${post.id}"></div>

                            <div
                                class="comment-input-row"
                                style="
                                    margin-top:18px;
                                ">

                                <textarea
                                    id="komentar-${post.id}"
                                    class="form-control"
                                    rows="2"
                                    placeholder="Tulis komentar..."></textarea>

                                <button
                                    class="btn-comment"
                                    onclick="kirimKomentar(${post.id})">

                                    Kirim

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
        `;
        });
        document.getElementById("listPost").innerHTML = html;
    } catch {
        document.getElementById("listPost").innerHTML = `
            <div class="card-tm empty-state">
                <h4>Gagal memuat forum</h4>
                <p>Tidak dapat terhubung ke server. Coba refresh halaman.</p>
            </div>`;
    }
}

async function buatPost() {

    const isiPost =
        document.getElementById(
            "isiPost"
        ).value;

    if(!isiPost.trim()){

        alert(
            "Isi postingan dulu"
        );

        return;
    }

    const body = {

        isiPost,

        user:{
            id:user.id
        }
    };

    await fetch(POST_API, {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(body)
    });

    document.getElementById(
        "isiPost"
    ).value = "";

    loadPost();
}
async function hapusPost(id) {
    if (!confirm("Hapus postingan ini?")) return;
    await fetch(`${POST_API}/${id}`, { method: "DELETE" }); 
    loadPost();
}

async function kirimKomentar(postId){

    const input =
        document.getElementById(
            `komentar-${postId}`
        );

    const isiKomentar =
        input.value;

    if(!isiKomentar.trim()) return;

    const parentId =
        input.getAttribute(
            "data-parent"
        );

    const body = {

        isiKomentar,

        post:{
            id:postId
        },

        user:{
            id:user.id
        }
    };

    if(parentId){

        body.parentComment = {
            id:parentId
        };
    }

    await fetch(COMMENT_API, {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(body)
    });

    input.value = "";

    input.removeAttribute(
        "data-parent"
    );

    loadKomentar(postId);
}

async function toggleKomentar(postId){

    const wrapper =
        document.getElementById(
            `komentar-wrapper-${postId}`
        );

    if(wrapper.style.display === "none"){

        wrapper.style.display = "block";

        loadKomentar(postId);

    }else{

        wrapper.style.display = "none";
    }
}

async function loadKomentar(postId){

    try{

        const res =
            await fetch(
                `${COMMENT_API}/${postId}`
            );

        const data =
            await res.json();

        document.getElementById(
            `comment-list-${postId}`
        ).innerHTML =
            renderKomentarTree(
                data,
                0,
                postId
            );

    }catch(err){

        console.log(err);
    }
}

function renderKomentarTree(
    comments,
    level = 0,
    postId
){

    let html = "";

    comments.forEach(c => {

        const canDelete =
            c.userId == user.id ||
            user.role == 'ADMIN';

        html += `

        <div
            class="comment-item"
            style="
                margin-left:${level * 25}px;
            ">

            <div class="comment-avatar">

                ${initial(c.namaUser)}

            </div>

            <div class="comment-body">

                <div class="comment-meta">

                    <span class="comment-name">

                        ${c.namaUser}

                    </span>

                    <div class="comment-actions">

                        <button
                            class="btn-reply-link"
                            onclick="replyComment(${c.id}, ${postId})">

                            Balas

                        </button>

                        ${
                            canDelete

                            ?

                            `
                            <button
                                class="comment-del"
                                onclick="hapusKomentar(${c.id}, ${postId})">

                                Hapus

                            </button>
                            `

                            :

                            ''
                        }

                    </div>

                </div>

                <div class="comment-text">

                    ${formatKomentarTeks(c.isiKomentar)}

                </div>

                ${
                    c.replies &&
                    c.replies.length > 0

                    ?

                    `
                    <button
                        class="btn-reply-link mt-2"
                        onclick="toggleReply(${c.id})">

                        Lihat ${c.replies.length} balasan

                    </button>

                    <div
                        id="reply-${c.id}"
                        style="
                            display:none;
                        ">

                        ${
                            renderKomentarTree(
                                c.replies,
                                level + 1,
                                postId
                            )
                        }

                    </div>
                    `

                    :

                    ''
                }

            </div>

        </div>
        `;
    });

    return html;
}

function toggleReply(commentId){

    const el =
        document.getElementById(
            `reply-${commentId}`
        );

    if(el.style.display === "none"){

        el.style.display = "block";

    }else{

        el.style.display = "none";
    }
}
function replyComment(commentId, postId){

    const input =
        document.getElementById(
            `komentar-${postId}`
        );

    input.focus();

    input.setAttribute(
        "data-parent",
        commentId
    );
}
