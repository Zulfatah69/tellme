<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe - Profil Saya</title>
    <script src="/js/auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        
        :root,
        [data-theme="light"] {
            --navy: #0f1f3d;
            --teal: #0e9f8e;
            --teal-light: #12b5a2;
            --cream: #f7f6f2;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f7f6f2;
            --surface: #ffffff;
            --surface2: #f3f4f6;
            --text: #1f2937;
            --text-soft: #374151;
            --nav-bg: #ffffff;
            --nav-shadow: 0 1px 8px rgba(15,31,61,0.06);
            --hero-gradient: linear-gradient(135deg, var(--navy) 0%, #1a3560 100%);
            --card-shadow: 0 1px 4px rgba(0,0,0,0.04);
            --toggle-track: #e5e7eb;
            --toggle-thumb: #0e9f8e;
            --toggle-pos: 2px;
            --input-bg: #ffffff;
            --msg-success-bg: #f0fdf4;
            --msg-success-border: #bbf7d0;
            --msg-success-text: #15803d;
            --msg-error-bg: #fef2f2;
            --msg-error-border: #fecaca;
            --msg-error-text: #dc2626;
        }

        
        [data-theme="dark"] {
            --navy: #e2e8f0;
            --teal: #2dd4bf;
            --teal-light: #5eead4;
            --cream: #0a0a0f;
            --muted: #7a7a9a;
            --border: rgba(255,255,255,0.08);
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #1a1a24;
            --text: #f0eff8;
            --text-soft: #cbd5e1;
            --nav-bg: rgba(17,17,24,0.92);
            --nav-shadow: 0 1px 8px rgba(0,0,0,0.35);
            --hero-gradient: linear-gradient(135deg, #0d1b33 0%, #0f1f3d 100%);
            --card-shadow: 0 4px 24px rgba(0,0,0,0.3);
            --toggle-track: #22222f;
            --toggle-thumb: #6c63ff;
            --toggle-pos: 24px;
            --input-bg: #16161f;
            --msg-success-bg: rgba(21,128,61,0.1);
            --msg-success-border: rgba(21,128,61,0.25);
            --msg-success-text: #4ade80;
            --msg-error-bg: rgba(220,38,38,0.1);
            --msg-error-border: rgba(220,38,38,0.2);
            --msg-error-text: #f87171;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            margin: 0;
            color: var(--text);
            transition: background 0.35s ease, color 0.35s ease;
        }

        
        .tm-nav {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            box-shadow: var(--nav-shadow);
            backdrop-filter: blur(16px);
            transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }
        .tm-nav .inner {
            display: flex; align-items: center; height: 64px;
            max-width: 1200px; margin: auto; padding: 0 24px; gap: 0;
        }
        .tm-brand {
            font-family: 'Sora', sans-serif; font-size: 1.35rem; font-weight: 700;
            color: var(--navy); text-decoration: none; letter-spacing: -0.02em;
            margin-right: 40px; flex-shrink: 0;
            transition: color 0.35s ease;
        }
        .tm-brand span { color: var(--teal); }
        .tm-links { display: flex; align-items: center; gap: 2px; flex: 1; }
        .tm-links a {
            color: var(--muted); text-decoration: none; font-size: 0.87rem;
            font-weight: 500; padding: 7px 13px; border-radius: 8px;
            transition: color 0.15s, background 0.15s; white-space: nowrap;
        }
        .tm-links a:hover { color: var(--navy); background: var(--surface2); }
        .tm-links a.active { color: var(--teal); background: rgba(14,159,142,0.09); font-weight: 600; }
        [data-theme="dark"] .tm-links a:hover { color: var(--text); }
        [data-theme="dark"] .tm-links a.active { background: rgba(45,212,191,0.1); }

        .tm-user { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .tm-hello { font-size: 0.84rem; color: var(--muted); transition: color 0.35s ease; }
        .tm-hello strong { color: var(--navy); transition: color 0.35s ease; }

        .btn-logout {
            background: transparent; border: 1.5px solid var(--border);
            border-radius: 8px; padding: 6px 14px; font-size: 0.82rem;
            font-weight: 600; color: var(--muted); cursor: pointer;
            transition: all 0.15s; font-family: 'DM Sans', sans-serif;
        }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

        
        .theme-toggle {
            display: flex; align-items: center; gap: .5rem;
            cursor: pointer; user-select: none; flex-shrink: 0;
        }
        .theme-toggle-label {
            font-size: 0.8rem; font-weight: 600; color: var(--muted);
            transition: color 0.2s; white-space: nowrap;
        }
        .toggle-track {
            position: relative; width: 44px; height: 22px;
            background: var(--toggle-track);
            border: 1px solid var(--border);
            border-radius: 100px;
            transition: all 0.3s ease; flex-shrink: 0;
        }
        .toggle-thumb {
            position: absolute; top: 2px; left: var(--toggle-pos);
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--toggle-thumb);
            box-shadow: 0 0 6px rgba(14,159,142,0.4);
            transition: left 0.3s cubic-bezier(.34,1.56,.64,1), background 0.3s ease, box-shadow 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.55rem;
        }
        [data-theme="dark"] .toggle-thumb { box-shadow: 0 0 8px rgba(108,99,255,0.5); }

        
        .page-wrap { max-width: 680px; margin: 0 auto; padding: 40px 24px; }

        
        .profile-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px; overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }
        .profile-top {
            background: var(--hero-gradient);
            padding: 36px 36px 24px; text-align: center;
            transition: background 0.35s ease;
        }
        .avatar-lg {
            width: 88px; height: 88px; border-radius: 50%;
            background: var(--teal); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Sora', sans-serif; font-size: 2rem; font-weight: 700;
            margin: 0 auto 14px; border: 3px solid rgba(255,255,255,0.2);
            transition: background 0.35s ease;
        }
        .profile-name {
            font-family: 'Sora', sans-serif; font-size: 1.35rem;
            font-weight: 700; color: #fff; margin-bottom: 4px;
        }
        .profile-nim { font-size: 0.83rem; color: rgba(255,255,255,0.5); }
        .profile-role {
            display: inline-block;
            background: rgba(14,159,142,0.2); color: var(--teal);
            font-size: 0.72rem; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
            margin-top: 8px; font-family: 'Sora', sans-serif;
            letter-spacing: 0.05em; text-transform: uppercase;
            transition: color 0.35s ease;
        }

        .profile-body {
            padding: 32px;
            background: var(--surface);
            transition: background 0.35s ease;
        }
        .section-label {
            font-size: 0.72rem; font-weight: 700; color: var(--muted);
            letter-spacing: 0.08em; text-transform: uppercase;
            margin-bottom: 16px;
            transition: color 0.35s ease;
        }
        .form-label {
            font-size: 0.78rem; font-weight: 500; color: var(--navy);
            margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase;
            display: block; transition: color 0.35s ease;
        }
        .form-control {
            border: 1.5px solid var(--border); border-radius: 10px;
            padding: 11px 16px; font-size: 0.92rem; color: var(--navy);
            background: var(--input-bg); width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.35s ease, color 0.35s ease;
            font-family: 'DM Sans', sans-serif;
        }
        .form-control:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(14,159,142,0.12);
            outline: none;
        }
        [data-theme="dark"] .form-control { color: var(--text); }
        [data-theme="dark"] .form-control:focus { box-shadow: 0 0 0 3px rgba(45,212,191,0.1); }
        .form-control::placeholder { color: var(--muted); }

        .mb-3 { margin-bottom: 1rem; }

        .divider {
            border: none; border-top: 1px solid var(--border);
            margin: 24px 0;
            transition: border-color 0.35s ease;
        }

        .btn-save {
            background: var(--teal); color: #fff; border: none;
            border-radius: 10px; padding: 12px;
            font-family: 'Sora', sans-serif; font-weight: 600;
            font-size: 0.92rem; width: 100%; cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(14,159,142,0.25);
        }
        .btn-save:hover {
            background: var(--teal-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(14,159,142,0.35);
        }
        [data-theme="dark"] .btn-save { box-shadow: 0 4px 14px rgba(45,212,191,0.15); }
        [data-theme="dark"] .btn-save:hover { box-shadow: 0 6px 20px rgba(45,212,191,0.25); }

        .msg-box {
            border-radius: 10px; padding: 11px 16px;
            font-size: 0.84rem; margin-top: 14px; display: none;
            transition: background 0.35s ease, border-color 0.35s ease, color 0.35s ease;
        }
        .msg-box.success {
            background: var(--msg-success-bg);
            border: 1px solid var(--msg-success-border);
            color: var(--msg-success-text);
            display: block;
        }
        .msg-box.error {
            background: var(--msg-error-bg);
            border: 1px solid var(--msg-error-border);
            color: var(--msg-error-text);
            display: block;
        }
    </style>
</head>
<body>


<script>
(function() {
    const saved = localStorage.getItem('tellme-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
})();
</script>

<script>
const user = JSON.parse(localStorage.getItem("user"));
if (!user) window.location.href = "/login.html";
if (user && user.role === "ADMIN") window.location.href = "/admin.html";
window.onload = function() {
    document.querySelectorAll(".namaUser").forEach(el => el.innerText = user.nama);
    loadProfile();
    applyThemeUI(document.documentElement.getAttribute('data-theme') || 'light');
}
</script>

<nav class="tm-nav">
    <div class="inner">
        <a class="tm-brand" href="/index.html">Tell<span>Me</span></a>
        <div class="tm-links">
            <a href="/index.html">Beranda</a>
            <a href="/aspirasi.html">Buat Aspirasi</a>
            <a href="/forum.html">Forum</a>
            <a href="/profile.html" class="active">Profil</a>
        </div>
        <div class="tm-user">
            <div class="theme-toggle" onclick="toggleTheme()" title="Ganti tema">
                <div class="toggle-track">
                    <div class="toggle-thumb" id="toggleThumb">
                        <span id="toggleIcon">☀️</span>
                    </div>
                </div>
                <span class="theme-toggle-label" id="themeLabel">Terang</span>
            </div>
            <div class="tm-hello">Halo, <strong class="namaUser"></strong></div>
            <button class="btn-logout" onclick="logout()">Keluar</button>
        </div>
    </div>
</nav>

<div class="page-wrap">
    <div class="profile-card">
        <div class="profile-top">
            <div class="avatar-lg" id="avatarHuruf">U</div>
            <div class="profile-name namaUser"></div>
            <div class="profile-nim" id="profileNim"></div>
            <div class="profile-role">Mahasiswa</div>
        </div>
        <div class="profile-body">
            <div class="section-label">Edit Informasi</div>
            <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="nama" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">NIM</label>
                <input type="text" id="nim" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control">
            </div>
            <hr class="divider">
            <div class="section-label">Ganti Password</div>
            <div class="mb-3">
                <label class="form-label">Password Baru</label>
                <input type="password" id="password" class="form-control" placeholder="Isi jika ingin mengganti password">
            </div>
            <button class="btn-save" onclick="updateProfile()">Simpan Perubahan</button>
            <div id="message" class="msg-box"></div>
        </div>
    </div>
</div>

<script>
const API = "http://localhost:8080/api/users";

async function logout() {
    try {
        await authenticatedFetch("http://localhost:8080/api/auth/logout", { method: "POST" });
    } catch (e) {
        console.error("Gagal logout di server:", e);
    }
    localStorage.removeItem("user");
    window.location.href = "/login.html";
}


function applyThemeUI(theme) {
    const isLight = theme === 'light';
    document.getElementById('themeLabel').textContent = isLight ? 'Terang' : 'Gelap';
    document.getElementById('toggleIcon').textContent  = isLight ? '☀️' : '🌙';
}

function toggleTheme() {
    const html    = document.documentElement;
    const current = html.getAttribute('data-theme') || 'light';
    const next    = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tellme-theme', next);
    applyThemeUI(next);
}


function loadProfile() {
    document.getElementById("nama").value     = user.nama;
    document.getElementById("nim").value      = user.nim;
    document.getElementById("email").value    = user.email;
    document.getElementById("password").value = "";
    document.getElementById("avatarHuruf").innerText = user.nama.charAt(0).toUpperCase();
    document.getElementById("profileNim").innerText  = user.nim;
}

async function updateProfile() {
    const nama     = document.getElementById("nama").value;
    const nim      = document.getElementById("nim").value;
    const email    = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const msg      = document.getElementById("message");
    msg.className  = "msg-box";

    try {
        const res = await authenticatedFetch(`${API}/${user.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nama, nim, email, password, role: user.role, token: user.token })
        });
        const updatedUser = await res.json();
        localStorage.setItem("user", JSON.stringify(updatedUser));
        msg.className = "msg-box success";
        msg.innerText = "✓ Profil berhasil diperbarui!";
        document.getElementById("avatarHuruf").innerText = updatedUser.nama.charAt(0).toUpperCase();
        document.querySelectorAll(".namaUser").forEach(el => el.innerText = updatedUser.nama);
    } catch {
        msg.className = "msg-box error";
        msg.innerText = "Gagal memperbarui profil. Coba lagi.";
    }
}
</script>
</body>
</html>
