<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe — Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root{
            --ink:#0d0d0d;
            --paper:#f7f4ee;
            --accent:#ff4d2e;
            --accent2:#1a1aff;
            --muted:#8f8f82;
            --border:#e3dfd6;
            --card:#ffffff;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'DM Sans',sans-serif;
            background:var(--paper);
            color:var(--ink);
            min-height:100vh;
            overflow-x:hidden;
        }

        body::before{
            content:'';
            position:fixed;
            inset:0;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255,77,46,0.07) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(26,26,255,0.06) 0%, transparent 40%);
            pointer-events:none;
            z-index:0;
        }

        body::after{
            content:'';
            position:fixed;
            inset:0;
            background-image:
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size:28px 28px;
            pointer-events:none;
            z-index:0;
        }

        /* NAVBAR */

        nav{
            position:sticky;
            top:0;
            z-index:100;
            height:64px;
            padding:0 2rem;
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(13,13,13,0.82);
            backdrop-filter:blur(14px);
            border-bottom:1px solid rgba(255,255,255,0.05);
        }

        .nav-brand{
            font-family:'Syne',sans-serif;
            font-size:1.4rem;
            font-weight:800;
            color:white;
            text-decoration:none;
            letter-spacing:-0.04em;
        }

        .nav-brand span{
            color:var(--accent);
        }

        .nav-links{
            display:flex;
            align-items:center;
            gap:.25rem;
            list-style:none;
        }

        .nav-links a{
            text-decoration:none;
            color:#999;
            font-size:.84rem;
            padding:.45rem .8rem;
            border-radius:8px;
            transition:.2s;
        }

        .nav-links a:hover,
        .nav-links a.active{
            background:rgba(255,255,255,0.08);
            color:white;
        }

        .nav-links a.active{
            color:var(--accent);
        }

        .nav-right{
            display:flex;
            align-items:center;
            gap:1rem;
        }

        .nav-greeting{
            font-size:.82rem;
            color:#777;
        }

        .nav-greeting strong{
            color:white;
            font-weight:500;
        }

        .btn-logout{
            border:none;
            background:var(--accent);
            color:var(--ink);
            font-family:'Syne',sans-serif;
            font-size:.72rem;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:.08em;
            padding:.55rem 1rem;
            border-radius:8px;
            cursor:pointer;
            transition:.2s;
        }

        .btn-logout:hover{
            transform:translateY(-2px);
            opacity:.9;
        }

        /* MAIN */

        main{
            position:relative;
            z-index:1;
            max-width:720px;
            margin:auto;
            padding:4rem 1.5rem 5rem;
        }

        .page-header{
            margin-bottom:3rem;
            animation:fadeUp .5s ease forwards;
        }

        .page-eyebrow{
            font-family:'Syne',sans-serif;
            font-size:.72rem;
            font-weight:800;
            letter-spacing:.15em;
            text-transform:uppercase;
            color:var(--accent);
            margin-bottom:.8rem;
            display:flex;
            align-items:center;
            gap:.5rem;
        }

        .page-eyebrow::before{
            content:'';
            width:24px;
            height:2px;
            background:var(--accent);
        }

        .page-title{
            font-family:'Syne',sans-serif;
            font-size:clamp(2.5rem,6vw,4.5rem);
            line-height:1;
            letter-spacing:-0.05em;
            font-weight:800;
        }

        .page-title em{
            color:var(--accent2);
            font-style:normal;
        }

        .page-subtitle{
            margin-top:1rem;
            max-width:520px;
            color:var(--muted);
            line-height:1.8;
            font-size:.96rem;
            font-weight:300;
        }

        /* PROFILE CARD */

        .profile-card{
            position:relative;
            background:rgba(255,255,255,0.82);
            backdrop-filter:blur(12px);
            border:1.5px solid var(--border);
            border-radius:28px;
            padding:2.5rem;
            overflow:hidden;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.05),
                0 2px 10px rgba(0,0,0,0.04);
            animation:fadeUp .5s ease forwards;
        }

        .profile-card::before{
            content:'';
            position:absolute;
            top:0;
            left:0;
            right:0;
            height:3px;
            background:linear-gradient(
                90deg,
                var(--accent),
                var(--accent2)
            );
        }

        .profile-top{
            text-align:center;
            margin-bottom:2.2rem;
        }

        .profile-avatar{
            width:110px;
            height:110px;
            border-radius:50%;
            background:linear-gradient(
                135deg,
                var(--accent),
                var(--accent2)
            );
            display:flex;
            justify-content:center;
            align-items:center;
            margin:auto auto 1.2rem;
            box-shadow:
                0 15px 35px rgba(0,0,0,0.12);
        }

        .profile-avatar span{
            font-family:'Syne',sans-serif;
            font-size:2.8rem;
            font-weight:800;
            color:white;
        }

        .profile-heading{
            font-family:'Syne',sans-serif;
            font-size:1.8rem;
            font-weight:800;
            letter-spacing:-0.03em;
        }

        .profile-sub{
            color:var(--muted);
            margin-top:.45rem;
            font-size:.92rem;
        }

        /* FORM */

        .field-group{
            margin-bottom:1.4rem;
        }

        .field-label{
            display:block;
            margin-bottom:.6rem;
            font-family:'Syne',sans-serif;
            font-size:.72rem;
            font-weight:700;
            letter-spacing:.12em;
            text-transform:uppercase;
            color:var(--muted);
        }

        .input{
            width:100%;
            border:none;
            outline:none;
            background:var(--paper);
            border:1.5px solid var(--border);
            border-radius:14px;
            padding:1rem 1.1rem;
            font-family:'DM Sans',sans-serif;
            font-size:.95rem;
            color:var(--ink);
            transition:.2s;
        }

        .input:focus{
            border-color:var(--accent2);
            box-shadow:
                0 0 0 3px rgba(26,26,255,0.08);
        }

        .btn-save{
            width:100%;
            border:none;
            border-radius:14px;
            padding:1rem;
            margin-top:.6rem;
            background:var(--ink);
            color:white;
            font-family:'Syne',sans-serif;
            font-size:.95rem;
            font-weight:700;
            cursor:pointer;
            transition:.25s;
            position:relative;
            overflow:hidden;
        }

        .btn-save::before{
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(
                90deg,
                var(--accent),
                var(--accent2)
            );
            opacity:0;
            transition:.3s;
        }

        .btn-save span{
            position:relative;
            z-index:1;
        }

        .btn-save:hover::before{
            opacity:1;
        }

        .btn-save:hover{
            transform:translateY(-2px);
        }

        /* MESSAGE */

        .message{
            margin-top:1.3rem;
            padding:1rem;
            border-radius:14px;
            font-size:.9rem;
            display:none;
            text-align:center;
            animation:fadeUp .3s ease;
        }

        .message.success{
            display:block;
            background:#e4f7ea;
            color:#18794e;
            border:1px solid #ccefd7;
        }

        .message.error{
            display:block;
            background:#ffe4e4;
            color:#c62828;
            border:1px solid #ffd0d0;
        }

        /* BLOBS */

        .blob{
            position:fixed;
            border-radius:50%;
            filter:blur(90px);
            opacity:.16;
            pointer-events:none;
            z-index:0;
        }

        .blob1{
            width:260px;
            height:260px;
            background:var(--accent);
            top:-80px;
            right:-80px;
        }

        .blob2{
            width:240px;
            height:240px;
            background:var(--accent2);
            bottom:-100px;
            left:-80px;
        }

        @keyframes fadeUp{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @media(max-width:768px){

            nav{
                padding:0 1rem;
            }

            .nav-links{
                display:none;
            }

            main{
                padding:2.5rem 1rem 4rem;
            }

            .profile-card{
                padding:1.8rem 1.4rem;
                border-radius:22px;
            }

            .page-title{
                font-size:3rem;
            }

        }

    </style>
</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
    window.location.href = "/login.html";
}

if(user.role === "ADMIN"){
    window.location.href = "/admin.html";
}

window.onload = function(){

    const namaElements =
        document.querySelectorAll(".namaUser");

    namaElements.forEach(el => {
        el.innerText = user.nama;
    });

    loadProfile();
}

</script>

<nav>

    <a href="#" class="nav-brand">
        Tell<span>Me</span>
    </a>

    <ul class="nav-links">

        <li>
            <a href="/index.html">
                Beranda
            </a>
        </li>

        <li>
            <a href="/aspirasi.html">
                Buat Aspirasi
            </a>
        </li>

        <li>
            <a href="/forum.html">
                Forum
            </a>
        </li>

        <li>
            <a href="/riwayat.html">
                Riwayat
            </a>
        </li>

        <li>
            <a href="/profile.html" class="active">
                Profile
            </a>
        </li>

    </ul>

    <div class="nav-right">

        <span class="nav-greeting">
            Halo,
            <strong class="namaUser"></strong>
        </span>

        <button
            class="btn-logout"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>

<main>

    <div class="page-header">

        <div class="page-eyebrow">
            Akun Pengguna
        </div>

        <h1 class="page-title">
            My<br>
            <em>Profile</em>
        </h1>

        <p class="page-subtitle">
            Kelola informasi akun dan perbarui data profilmu dengan tampilan yang modern dan simpel.
        </p>

    </div>

    <div class="profile-card">

        <div class="profile-top">

            <div class="profile-avatar">

                <span id="avatarHuruf">
                    U
                </span>

            </div>

            <h2 class="profile-heading">
                Profile Saya
            </h2>

            <p class="profile-sub">
                Informasi akun pribadi TellMe
            </p>

        </div>

        <div class="field-group">

            <label class="field-label">
                Nama Lengkap
            </label>

            <input
                type="text"
                id="nama"
                class="input">

        </div>

        <div class="field-group">

            <label class="field-label">
                NIM
            </label>

            <input
                type="text"
                id="nim"
                class="input">

        </div>

        <div class="field-group">

            <label class="field-label">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="input">

        </div>

        <div class="field-group">

            <label class="field-label">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="input">

        </div>

        <button
            class="btn-save"
            onclick="updateProfile()">

            <span>
                Simpan Perubahan
            </span>

        </button>

        <div
            id="message"
            class="message">
        </div>

    </div>

</main>

<script>

const API =
    "http://localhost:8080/api/users";

function logout(){

    localStorage.removeItem("user");

    window.location.href = "/login.html";
}

function loadProfile(){

    document.getElementById("nama").value =
        user.nama;

    document.getElementById("nim").value =
        user.nim;

    document.getElementById("email").value =
        user.email;

    document.getElementById("password").value =
        user.password;

    document.getElementById("avatarHuruf").innerText =
        user.nama.charAt(0).toUpperCase();
}

async function updateProfile(){

    const nama =
        document.getElementById("nama").value;

    const nim =
        document.getElementById("nim").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    try{

        const res = await fetch(`${API}/${user.id}`,{

            method:"PUT",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                nama:nama,
                nim:nim,
                email:email,
                password:password,
                role:user.role

            })

        });

        const updatedUser =
            await res.json();

        localStorage.setItem(
            "user",
            JSON.stringify(updatedUser)
        );

        message.className =
            "message success";

        message.innerHTML =
            "Profile berhasil diperbarui";

    }catch(err){

        message.className =
            "message error";

        message.innerHTML =
            "Gagal memperbarui profile";

    }
}

</script>

</body>
</html>
