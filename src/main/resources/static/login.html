<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe — Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root{
            --ink:#0d0d0d;
            --paper:#f7f4ee;
            --accent:#ff4d2e;
            --accent2:#1a1aff;
            --muted:#8f8f82;
            --border:#e3dfd6;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'DM Sans',sans-serif;
            background:var(--paper);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            position:relative;
            color:var(--ink);
        }

        body::before{
            content:'';
            position:absolute;
            inset:0;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255,77,46,0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(26,26,255,0.07) 0%, transparent 40%);
            z-index:0;
        }

        body::after{
            content:'';
            position:absolute;
            inset:0;
            background-image:
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size:28px 28px;
            z-index:0;
        }

        .blob{
            position:absolute;
            border-radius:50%;
            filter:blur(90px);
            opacity:.16;
            pointer-events:none;
            z-index:0;
        }

        .blob1{
            width:260px;
            height:260px;
            background:var(--accent);
            top:-80px;
            right:-80px;
        }

        .blob2{
            width:240px;
            height:240px;
            background:var(--accent2);
            bottom:-100px;
            left:-80px;
        }

        .login-wrap{
            position:relative;
            z-index:1;
            width:100%;
            max-width:430px;
            padding:1rem;
        }

        .login-card{
            position:relative;
            background:rgba(255,255,255,0.82);
            backdrop-filter:blur(12px);
            border:1.5px solid var(--border);
            border-radius:28px;
            padding:2.5rem;
            overflow:hidden;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.05),
                0 2px 10px rgba(0,0,0,0.04);
            animation:fadeUp .5s ease forwards;
        }

        .login-card::before{
            content:'';
            position:absolute;
            top:0;
            left:0;
            right:0;
            height:3px;
            background:linear-gradient(
                90deg,
                var(--accent),
                var(--accent2)
            );
        }

        .brand{
            font-family:'Syne',sans-serif;
            font-size:1.8rem;
            font-weight:800;
            letter-spacing:-0.05em;
            text-align:center;
            margin-bottom:.5rem;
        }

        .brand span{
            color:var(--accent);
        }

        .subtitle{
            text-align:center;
            color:var(--muted);
            font-size:.92rem;
            line-height:1.7;
            margin-bottom:2rem;
            font-weight:300;
        }

        .field-group{
            margin-bottom:1.2rem;
        }

        .field-label{
            display:block;
            margin-bottom:.6rem;
            font-family:'Syne',sans-serif;
            font-size:.72rem;
            font-weight:700;
            letter-spacing:.12em;
            text-transform:uppercase;
            color:var(--muted);
        }

        .input{
            width:100%;
            border:none;
            outline:none;
            background:var(--paper);
            border:1.5px solid var(--border);
            border-radius:14px;
            padding:1rem 1.1rem;
            font-family:'DM Sans',sans-serif;
            font-size:.95rem;
            color:var(--ink);
            transition:.2s;
            box-shadow:
                inset 0 1px 2px rgba(0,0,0,0.04);
        }

        .input:focus{
            border-color:var(--accent2);
            box-shadow:
                0 0 0 3px rgba(26,26,255,0.08);
        }

        .input::placeholder{
            color:#bbb;
        }

        .btn-login{
            width:100%;
            border:none;
            border-radius:14px;
            padding:1rem;
            margin-top:.5rem;
            background:var(--ink);
            color:white;
            font-family:'Syne',sans-serif;
            font-size:.95rem;
            font-weight:700;
            cursor:pointer;
            transition:.25s;
            position:relative;
            overflow:hidden;
            box-shadow:
                0 10px 20px rgba(255,77,46,0.15),
                0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-login::before{
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(
                90deg,
                var(--accent),
                var(--accent2)
            );
            opacity:0;
            transition:.3s;
        }

        .btn-login span{
            position:relative;
            z-index:1;
        }

        .btn-login:hover::before{
            opacity:1;
        }

        .btn-login:hover{
            transform:translateY(-2px);
        }

        .error{
            color:var(--accent);
            text-align:center;
            font-size:.84rem;
            margin-top:1rem;
            min-height:20px;
        }

        .register-link{
            margin-top:1.8rem;
            text-align:center;
            font-size:.9rem;
            color:var(--muted);
        }

        .register-link a{
            color:var(--accent2);
            text-decoration:none;
            font-weight:600;
            transition:.2s;
        }

        .register-link a:hover{
            opacity:.7;
        }

        .deco-number{
            position:absolute;
            top:1.2rem;
            right:1.5rem;
            font-family:'Syne',sans-serif;
            font-size:5rem;
            font-weight:800;
            color:#ece7dc;
            line-height:1;
            pointer-events:none;
            letter-spacing:-0.05em;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:480px){
            .login-card{
                padding:2rem 1.4rem;
                border-radius:22px;
            }

            .brand{
                font-size:1.6rem;
            }
        }
    </style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="login-wrap">
    <div class="login-card">
        <div class="deco-number">01</div>

        <h1 class="brand">Tell<span>Me</span></h1>

        <p class="subtitle">
            Masuk untuk mulai berdiskusi dan menyampaikan aspirasi kampus secara modern dan terbuka.
        </p>

        <div class="field-group">
            <label class="field-label">Email atau NIM</label>
            <input
                type="text"
                id="email"
                class="input"
                placeholder="Masukkan email atau NIM">
        </div>

        <div class="field-group">
            <label class="field-label">Password</label>
            <input
                type="password"
                id="password"
                class="input"
                placeholder="Masukkan password">
        </div>

        <button class="btn-login" onclick="login()">
            <span>Login</span>
        </button>

        <p id="error" class="error"></p>

        <div class="register-link">
            Belum punya akun?
            <a href="/register.html">Register</a>
        </div>
    </div>
</div>

<script>
const API = "http://localhost:8080/api/auth/login";

async function login() {
    const identifier = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const res = await fetch(API, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                identifier: identifier,
                password: password
            })
        });

        if (!res.ok) {
            throw new Error("Login gagal");
        }

        const user = await res.json();

        // Simpan data user
        localStorage.setItem("user", JSON.stringify(user));

        // Ambil role dan ubah ke huruf besar
        const role = (user.role || "").toUpperCase();

        // Redirect berdasarkan role
        if (role === "ADMIN") {
            window.location.href = "/admin.html";
        } else if (role === "PENGELOLA") {
            window.location.href = "/pengelola.html";
        } else if (role === "MAHASISWA") {
            window.location.href = "/index.html";
        } else {
            // Default jika role tidak dikenali
            window.location.href = "/index.html";
        }

    } catch (err) {
        document.getElementById("error").innerText =
            "Email atau password salah";
    }
}

// Enter untuk login
document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        login();
    }
});
</script>

</body>
</html>
