<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TellMe — Admin</title>
<script src="/js/auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root,
[data-theme="dark"] {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --surface3: #22222f;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0eff8;
    --text-inv: #0a0a0f;
    --muted: #7a7a9a;
    --muted2: #4a4a6a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --accent4: #f7971e;
    --topbar-bg: rgba(10,10,15,0.85);
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
    --body-before: radial-gradient(ellipse 80% 50% at 20% -20%, rgba(108,99,255,0.12) 0%, transparent 60%),
                   radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255,101,132,0.08) 0%, transparent 60%);
    --grid-line: rgba(255,255,255,0.015);
    --toggle-track: #22222f;
    --toggle-border: rgba(108,99,255,0.3);
    --toggle-icon-pos: 2px;
}

[data-theme="light"] {
    --bg: #f4f4f8;
    --surface: #ffffff;
    --surface2: #f0f0f6;
    --surface3: #e8e8f0;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --text: #1a1a2e;
    --text-inv: #ffffff;
    --muted: #7878a0;
    --muted2: #b0b0c8;
    --accent: #5a52e8;
    --accent2: #e8546e;
    --accent3: #2dc96a;
    --accent4: #e8880e;
    --topbar-bg: rgba(244,244,248,0.9);
    --shadow: 0 4px 24px rgba(0,0,0,0.09);
    --body-before: radial-gradient(ellipse 80% 50% at 20% -20%, rgba(108,99,255,0.07) 0%, transparent 60%),
                   radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255,101,132,0.05) 0%, transparent 60%);
    --grid-line: rgba(0,0,0,0.025);
    --toggle-track: #e0e0f0;
    --toggle-border: rgba(90,82,232,0.3);
    --toggle-icon-pos: 24px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    transition: background 0.35s ease, color 0.35s ease;
}
body::before {
    content:'';
    position:fixed;
    inset:0;
    background: var(--body-before);
    pointer-events:none;
    z-index:0;
    transition: background 0.35s ease;
}
body::after {
    content:'';
    position:fixed;
    inset:0;
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
    z-index:0;
    transition: background-image 0.35s ease;
}

.theme-toggle {
    display: flex;
    align-items: center;
    gap: .6rem;
    cursor: pointer;
    user-select: none;
}
.theme-toggle-label {
    font-size: .78rem;
    font-weight: 600;
    color: var(--muted);
    transition: color 0.2s;
    white-space: nowrap;
}
.toggle-track {
    position: relative;
    width: 46px;
    height: 24px;
    background: var(--toggle-track);
    border: 1px solid var(--toggle-border);
    border-radius: 100px;
    transition: all 0.3s ease;
    flex-shrink: 0;
}
.toggle-thumb {
    position: absolute;
    top: 2px;
    left: var(--toggle-icon-pos);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(108,99,255,0.5);
    transition: left 0.3s cubic-bezier(.34,1.56,.64,1), background 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .6rem;
}

.sidebar-theme {
    padding: .75rem 1rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.3s;
}

.sidebar {
    position:fixed; top:0; left:0; width:260px; height:100vh;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; z-index:100;
    transition: background 0.35s ease, border-color 0.35s ease;
}
.sidebar-top {
    padding:2rem 1.5rem 1.5rem;
    border-bottom:1px solid var(--border);
    transition: border-color 0.35s ease;
}
.logo {
    font-family:'Fraunces',serif; font-size:1.8rem; font-weight:900;
    letter-spacing:-0.03em; color:var(--text);
    display:flex; align-items:center; gap:.5rem;
    transition: color 0.35s ease;
}
.logo-dot {
    width:8px; height:8px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 12px var(--accent);
    animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:.7} }
.logo-sub {
    font-size:.7rem; font-weight:500; color:var(--muted);
    letter-spacing:.15em; text-transform:uppercase; margin-top:.2rem;
    transition: color 0.35s ease;
}
.sidebar-nav {
    padding:1.2rem 1rem; flex:1;
    display:flex; flex-direction:column; gap:.2rem; overflow-y:auto;
}
.nav-section {
    font-size:.65rem; font-weight:700; color:var(--muted2);
    letter-spacing:.15em; text-transform:uppercase;
    padding:.8rem .8rem .4rem; margin-top:.5rem;
    transition: color 0.35s ease;
}
.menu-link {
    display:flex; align-items:center; gap:.75rem;
    text-decoration:none; color:var(--muted);
    padding:.75rem .9rem; border-radius:12px;
    transition:all .2s; font-size:.88rem; font-weight:500;
    cursor:pointer; position:relative; overflow:hidden;
}
.menu-link:hover { color:var(--text); background:var(--surface2); }
.menu-link.active {
    color:var(--text);
    background:linear-gradient(135deg,rgba(108,99,255,.2),rgba(108,99,255,.08));
    border:1px solid rgba(108,99,255,.25);
}
[data-theme="light"] .menu-link.active {
    background:linear-gradient(135deg,rgba(90,82,232,.12),rgba(90,82,232,.04));
    border:1px solid rgba(90,82,232,.2);
}
.menu-link.active::before {
    content:''; position:absolute; left:0; top:20%; bottom:20%;
    width:3px; background:var(--accent); border-radius:0 4px 4px 0;
    box-shadow:0 0 8px var(--accent);
}
.menu-icon {
    width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:.9rem; background:var(--surface2); flex-shrink:0;
    transition:all .2s;
}
.menu-link.active .menu-icon { background:rgba(108,99,255,.2); }
.sidebar-bottom {
    padding:1rem;
    border-top:1px solid var(--border);
    transition: border-color 0.35s ease;
}
.user-card {
    display:flex; align-items:center; gap:.75rem; padding:.75rem;
    border-radius:12px; background:var(--surface2); margin-bottom:.75rem;
    transition: background 0.35s ease;
}
.user-avatar {
    width:36px; height:36px; border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-size:.85rem; font-weight:800; color:white; flex-shrink:0;
}
.user-info { flex:1; min-width:0; }
.user-name {
    font-size:.82rem; font-weight:700; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition: color 0.35s ease;
}
.user-role {
    font-size:.7rem; color:var(--accent); font-weight:600;
    text-transform:uppercase; letter-spacing:.08em;
}
.btn-logout {
    width:100%; padding:.7rem; border-radius:10px;
    border:1px solid rgba(255,101,132,.2);
    background:rgba(255,101,132,.05);
    color:var(--accent2); font-size:.82rem; font-weight:600;
    cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;
    transition:all .2s; display:flex; align-items:center;
    justify-content:center; gap:.5rem;
}
.btn-logout:hover { background:rgba(255,101,132,.12); border-color:rgba(255,101,132,.4); }

.content { margin-left:260px; min-height:100vh; position:relative; z-index:1; }
.topbar {
    padding:1.5rem 2.5rem; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid var(--border);
    background:var(--topbar-bg); backdrop-filter:blur(20px);
    position:sticky; top:0; z-index:50;
    transition: background 0.35s ease, border-color 0.35s ease;
}
.topbar-right { display:flex; align-items:center; gap:1rem; }
.page-title {
    font-family:'Fraunces',serif; font-size:1.6rem;
    font-weight:700; letter-spacing:-.02em;
    transition: color 0.35s ease;
}
.status-badge {
    display:flex; align-items:center; gap:.5rem;
    padding:.5rem 1rem;
    background:rgba(67,233,123,.08);
    border:1px solid rgba(67,233,123,.2);
    border-radius:100px; font-size:.78rem; font-weight:600; color:var(--accent3);
}
[data-theme="light"] .status-badge {
    background:rgba(45,201,106,.08);
    border:1px solid rgba(45,201,106,.25);
}
.status-dot-live {
    width:6px; height:6px; border-radius:50%;
    background:var(--accent3);
    animation:pulse 1.5s ease-in-out infinite;
}
.content-area { padding:2rem 2.5rem; }

.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:2rem; }
.stat-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:1.5rem; position:relative; overflow:hidden;
    transition:transform .2s, border-color .2s, background 0.35s ease;
    animation:fadeUp .5s ease both;
    box-shadow: var(--shadow);
}
.stat-card:hover { transform:translateY(-2px); border-color:var(--border2); }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.stat-card:nth-child(1){animation-delay:.05s} .stat-card:nth-child(2){animation-delay:.1s}
.stat-card:nth-child(3){animation-delay:.15s} .stat-card:nth-child(4){animation-delay:.2s}
.stat-glow {
    position:absolute; top:-20px; right:-20px;
    width:80px; height:80px; border-radius:50%; filter:blur(30px); opacity:.4;
}
[data-theme="light"] .stat-glow { opacity:.2; }
.stat-icon {
    width:40px; height:40px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; margin-bottom:1rem;
}
.stat-title {
    font-size:.72rem; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.1em; margin-bottom:.4rem;
    transition: color 0.35s ease;
}
.stat-value { font-family:'Fraunces',serif; font-size:2.2rem; font-weight:700; line-height:1; color:var(--text); }
.c-purple .stat-glow{background:var(--accent)} .c-purple .stat-icon{background:rgba(108,99,255,.15)}
.c-pink .stat-glow{background:var(--accent2)} .c-pink .stat-icon{background:rgba(255,101,132,.15)}
.c-green .stat-glow{background:var(--accent3)} .c-green .stat-icon{background:rgba(67,233,123,.15)}
.c-orange .stat-glow{background:var(--accent4)} .c-orange .stat-icon{background:rgba(247,151,30,.15)}
[data-theme="light"] .c-purple .stat-icon{background:rgba(90,82,232,.1)}
[data-theme="light"] .c-pink .stat-icon{background:rgba(232,84,110,.1)}
[data-theme="light"] .c-green .stat-icon{background:rgba(45,201,106,.1)}
[data-theme="light"] .c-orange .stat-icon{background:rgba(232,136,14,.1)}

.panel {
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px; overflow:hidden; margin-bottom:1.5rem;
    animation:fadeUp .4s ease both;
    box-shadow: var(--shadow);
    transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
}
.panel-header {
    padding:1.2rem 1.5rem; border-bottom:1px solid var(--border);
    background:var(--surface2); display:flex; align-items:center;
    justify-content:space-between;
    transition: background 0.35s ease, border-color 0.35s ease;
}
.panel-title {
    font-family:'Fraunces',serif; font-size:1.1rem; font-weight:700;
    color:var(--text); transition: color 0.35s ease;
}
.panel-body { padding:1.5rem; }

.item-list { display:flex; flex-direction:column; gap:.75rem; }
.item-card {
    background:var(--surface2); border:1px solid var(--border);
    border-radius:16px; padding:1.25rem 1.5rem;
    transition:all .2s; animation:fadeUp .3s ease both;
}
.item-card:hover { border-color:var(--border2); background:var(--surface3); }
.item-head { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:.75rem; }
.item-title { font-weight:700; font-size:.95rem; color:var(--text); line-height:1.4; transition: color 0.35s ease; word-break: break-word; }
.item-metas { display:flex; flex-wrap:wrap; gap:.5rem; }
.meta-chip {
    display:inline-flex; align-items:center; gap:.3rem;
    padding:.3rem .7rem; border-radius:100px; font-size:.75rem;
    font-weight:500; background:var(--surface3); color:var(--muted);
    border:1px solid var(--border);
    transition: background 0.35s ease, color 0.35s ease;
}
.item-actions {
    display:flex; gap:.5rem; flex-wrap:wrap; margin-top:1rem;
    padding-top:1rem; border-top:1px solid var(--border);
}

.badge {
    display:inline-flex; align-items:center; gap:.3rem;
    padding:.3rem .8rem; border-radius:100px; font-size:.72rem;
    font-weight:700; letter-spacing:.04em; text-transform:uppercase;
}
.badge::before { content:''; width:5px; height:5px; border-radius:50%; }
.badge-pending { background:rgba(247,151,30,.12); color:#e07a00; border:1px solid rgba(247,151,30,.25); }
.badge-pending::before { background:#f7971e; }
.badge-proses { background:rgba(108,99,255,.12); color:#5a52e8; border:1px solid rgba(108,99,255,.25); }
.badge-proses::before { background:#a09bff; }
.badge-selesai { background:rgba(67,233,123,.12); color:#1aa855; border:1px solid rgba(67,233,123,.25); }
.badge-selesai::before { background:#43e97b; }
.badge-ditolak { background:rgba(255,101,132,.12); color:#c8304f; border:1px solid rgba(255,101,132,.25); }
.badge-ditolak::before { background:#ff6584; }
[data-theme="dark"] .badge-pending { color:#f7971e; }
[data-theme="dark"] .badge-proses { color:#a09bff; }
[data-theme="dark"] .badge-selesai { color:#43e97b; }
[data-theme="dark"] .badge-ditolak { color:#ff6584; }

.btn {
    padding:.55rem 1.1rem; border-radius:10px; border:none;
    cursor:pointer; font-size:.8rem; font-weight:700;
    font-family:'Plus Jakarta Sans',sans-serif;
    transition:all .18s; display:inline-flex; align-items:center; gap:.35rem;
}
.btn:hover { transform:translateY(-1px); }
.btn-purple { background:rgba(108,99,255,.15); color:#a09bff; border:1px solid rgba(108,99,255,.3); }
.btn-purple:hover { background:rgba(108,99,255,.25); }
.btn-green { background:rgba(67,233,123,.12); color:#2dc96a; border:1px solid rgba(67,233,123,.25); }
.btn-green:hover { background:rgba(67,233,123,.2); }
.btn-orange { background:rgba(247,151,30,.12); color:#e07a00; border:1px solid rgba(247,151,30,.25); }
.btn-orange:hover { background:rgba(247,151,30,.2); }
.btn-red { background:rgba(255,101,132,.12); color:#c8304f; border:1px solid rgba(255,101,132,.25); }
.btn-red:hover { background:rgba(255,101,132,.2); }
.btn-ghost { background:var(--surface3); color:var(--muted); border:1px solid var(--border); }
.btn-ghost:hover { color:var(--text); border-color:var(--border2); }
.btn-solid {
    background:var(--accent); color:white; border:none;
    box-shadow:0 4px 15px rgba(108,99,255,.3);
}
.btn-solid:hover { background:#7c74ff; box-shadow:0 6px 20px rgba(108,99,255,.4); }
[data-theme="dark"] .btn-green { color:#43e97b; }
[data-theme="dark"] .btn-orange { color:#f7971e; }
[data-theme="dark"] .btn-red { color:#ff6584; }
[data-theme="dark"] .btn-purple { color:#a09bff; }

.form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.75rem; margin-bottom:1rem; }
.form-input,.form-select {
    width:100%; padding:.85rem 1rem;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:12px; color:var(--text); font-size:.88rem;
    font-family:'Plus Jakarta Sans',sans-serif; outline:none;
    transition:all .2s;
}
.form-input::placeholder { color:var(--muted2); }
.form-input:focus,.form-select:focus {
    border-color:rgba(108,99,255,.5);
    box-shadow:0 0 0 3px rgba(108,99,255,.1);
    background:var(--surface3);
}
.form-select option { background:var(--surface2); color:var(--text); }

.data-table { width:100%; border-collapse:separate; border-spacing:0 .5rem; }
.data-table th {
    padding:.7rem 1rem; text-align:left; font-size:.72rem;
    font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.1em;
}
.data-table td {
    padding:1rem; background:var(--surface2); font-size:.88rem;
    border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    transition:background .2s, color 0.35s ease;
    color:var(--text);
}
.data-table td:first-child { border-left:1px solid var(--border); border-radius:12px 0 0 12px; }
.data-table td:last-child { border-right:1px solid var(--border); border-radius:0 12px 12px 0; }
.data-table tr:hover td { background:var(--surface3); }

.empty-state { padding:4rem 2rem; text-align:center; color:var(--muted); }
.empty-icon { font-size:2.5rem; margin-bottom:.75rem; display:block; }
.empty-text { font-size:.88rem; }

.big-stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; }
.big-stat {
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:2rem; text-align:center;
    position:relative; overflow:hidden; transition:transform .2s, background 0.35s ease;
    animation:fadeUp .4s ease both;
    box-shadow: var(--shadow);
}
.big-stat:hover { transform:translateY(-3px); }
.big-stat-num { font-family:'Fraunces',serif; font-size:3.5rem; font-weight:900; line-height:1; margin-bottom:.5rem; }
.big-stat-label { font-size:.82rem; color:var(--muted); font-weight:500; }
.big-stat-bar { position:absolute; bottom:0; left:0; right:0; height:3px; }

.toast {
    position:fixed; bottom:2rem; right:2rem; z-index:9999;
    padding:1rem 1.5rem; border-radius:16px; font-size:.88rem; font-weight:600;
    display:flex; align-items:center; gap:.6rem;
    transform:translateY(80px); opacity:0;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none; backdrop-filter:blur(20px);
}
.toast.show { transform:translateY(0); opacity:1; }
.toast.success { background:rgba(67,233,123,.12); border:1px solid rgba(67,233,123,.3); color:#43e97b; }
.toast.error { background:rgba(255,101,132,.12); border:1px solid rgba(255,101,132,.3); color:#ff6584; }
[data-theme="light"] .toast.success { background:rgba(45,201,106,.1); color:#1aa855; }
[data-theme="light"] .toast.error { background:rgba(200,48,79,.1); color:#c8304f; }

::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:10px; }

.sidebar, .sidebar-top, .sidebar-nav, .sidebar-bottom,
.menu-link, .menu-icon, .topbar, .stat-card, .panel,
.panel-header, .item-card, .data-table td, .form-input,
.form-select, .big-stat, .logo, .logo-sub, .nav-section,
.user-card, .user-name, .theme-toggle-label, .toggle-track,
.meta-chip, .panel-title, .item-title, .stat-label, .badge {
    transition-property: background, background-color, border-color, color, box-shadow, opacity;
    transition-duration: 0.3s;
    transition-timing-function: ease;
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div id="userModal" style="position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:99999; padding:20px;">
    <div style="width:100%; max-width:500px; background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:28px; box-shadow:var(--shadow);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <h2 style="font-size:22px; font-weight:800;">Edit User</h2>
            <button onclick="closeUserModal()" class="btn btn-red">✕</button>
        </div>
        <input type="hidden" id="editUserId">
        <div style="display:grid; gap:14px;">
            <div>
                <label style="display:block; margin-bottom:8px; font-size:14px; font-weight:700; color:var(--text);">Nama Lengkap</label>
                <input id="editNama" class="form-input" placeholder="Masukkan nama lengkap">
            </div>
            <div>

<script>
const API_ASPIRASI = "/api/aspirasi";
const API_FORUM    = "/api/forum";
const API_USER     = "/api/users";

let isProcessingAspirasi = false;
let isSubmittingFeedback = false;

const user = JSON.parse(localStorage.getItem("user"));
const nama = user.nama || user.email || "Admin";
document.getElementById("namaAdmin").textContent   = nama;
document.getElementById("userInitial").textContent = nama.charAt(0).toUpperCase();
document.getElementById("userRole").textContent    = user.role || "Admin";

function applyThemeUI(theme) {
    const isDark = theme === 'dark';
    document.getElementById('themeLabel').textContent  = isDark ? '🌙 Mode Gelap' : '☀️ Mode Terang';
    document.getElementById('toggleIcon').textContent  = isDark ? '🌙' : '☀️';
}

function toggleTheme() {
    const html  = document.documentElement;
    const current = html.getAttribute('data-theme') || 'dark';
    const next    = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tellme-theme', next);
    applyThemeUI(next);
}

applyThemeUI(document.documentElement.getAttribute('data-theme') || 'dark');

function showToast(msg, type = "success") {
    const t = document.getElementById("toast");
    t.textContent = (type === "success" ? "✓ " : "✗ ") + msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.className = "toast", 3200);
}

async function logout() {
    try {
        await authenticatedFetch("/api/auth/logout", { method: "POST" });
    } catch (e) {
        console.error("Gagal logout di server:", e);
    }
    localStorage.removeItem("user");
    window.location.href = "/login.html";
}

function setMenu(e, menu) {
    e.preventDefault();
    document.querySelectorAll(".menu-link").forEach(el => el.classList.remove("active"));
    e.currentTarget.classList.add("active");
    ({ dashboard:loadDashboard, aspirasi:loadAspirasi, forum:loadForum, user:loadUser })[menu]?.();
}

let dashboardData = [];
async function loadDashboard(){
    document.getElementById("judulHalaman").textContent = "Dashboard";
    document.getElementById("contentArea").innerHTML = `
        <div style="display:grid; gap:24px;">
            <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
                <button class="btn btn-purple" id="filterSemua" onclick="filterDashboard('semua')">Semua</button>
                <button class="btn btn-ghost" id="filterAkademik" onclick="filterDashboard('Akademik')">Akademik</button>
                <button class="btn btn-ghost" id="filterOrganisasi" onclick="filterDashboard('Organisasi')">Organisasi</button>
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:20px;">
                <div class="stat-card">
                    <div class="stat-title">Total User</div>
                    <div class="stat-value" id="statUser">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Total Forum</div>
                    <div class="stat-value" id="statForum">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Total Aspirasi</div>
                    <div class="stat-value" id="statAspirasi">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Diproses</div>
                    <div class="stat-value" id="statProses">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Selesai</div>
                    <div class="stat-value" id="statSelesai">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Ditolak</div>
                    <div class="stat-value" id="statTolak">0</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">Ringkasan Sistem</div>
                </div>
                <div class="panel-body">
                    <div style="display:grid; gap:14px; color:var(--muted); line-height:1.7;">
                        <div>Admin dapat memoderasi forum diskusi, mengelola data pengguna, dan merespon aspirasi mahasiswa.</div>
                        <div>Sistem terenkripsi secara aman dan melacak status penyelesaian aspirasi secara langsung.</div>
                    </div>
                </div>
            </div>
        </div>
    `;

    try{
        const users = await authenticatedFetch(API_USER).then(r => r.json());
        const forum = await authenticatedFetch(API_FORUM).then(r => r.json());
        const aspirasi = await authenticatedFetch(API_ASPIRASI).then(r => r.json());

        dashboardData = aspirasi;
        document.getElementById("statUser").textContent = users.length;
        document.getElementById("statForum").textContent = forum.length;
        filterDashboard("semua");
    }catch{
        showToast("Gagal memuat dashboard", "error");
    }
}

function filterDashboard(type){
    document.getElementById("filterSemua").className = "btn btn-ghost";
    document.getElementById("filterAkademik").className = "btn btn-ghost";
    document.getElementById("filterOrganisasi").className = "btn btn-ghost";

    if(type == "semua") document.getElementById("filterSemua").className = "btn btn-purple";
    if(type == "Akademik") document.getElementById("filterAkademik").className = "btn btn-purple";
    if(type == "Organisasi") document.getElementById("filterOrganisasi").className = "btn btn-purple";

    let data = dashboardData;
    if(type == "Akademik"){
        data = dashboardData.filter(a => a.kategori?.namaKategori == "Akademik");
    }
    if(type == "Organisasi"){
        data = dashboardData.filter(a => a.kategori?.namaKategori == "Organisasi");
    }

    document.getElementById("statAspirasi").innerText = data.length;
    document.getElementById("statProses").innerText = data.filter(a => a.status?.namaStatus?.toLowerCase() == "diproses").length;
    document.getElementById("statSelesai").innerText = data.filter(a => a.status?.namaStatus?.toLowerCase() == "selesai").length;
    document.getElementById("statTolak").innerText = data.filter(a => a.status?.namaStatus?.toLowerCase() == "ditolak").length;
}

let currentTab = "masuk";
let kategoriFilter = "semua";
let searchNama = "";

async function refreshAspirasiData() {
    try {
        window.allAspirasi = await authenticatedFetch(API_ASPIRASI).then(r => r.json());
        switchAspirasiTab(currentTab);
    } catch {
        showToast("Gagal memuat aspirasi", "error");
    }
}

async function loadAspirasi() {
    document.getElementById("judulHalaman").textContent = "Kelola Aspirasi";
    document.getElementById("contentArea").innerHTML = `
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">Kelola Aspirasi</div>
            </div>
            <div class="panel-body">
                <div style="margin-bottom:20px;">
                    <input type="text" id="searchNamaAspirasi" class="form-input" placeholder="🔍 Cari berdasarkan nama pengirim..." oninput="handleSearchNama(this.value)">
                </div>

                <div style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap;">
                    <button class="btn btn-purple" id="tabMasuk" onclick="switchAspirasiTab('masuk')">Aspirasi Masuk</button>
                    <button class="btn btn-ghost" id="tabProses" onclick="switchAspirasiTab('proses')">Diproses</button>
                    <button class="btn btn-ghost" id="tabSelesai" onclick="switchAspirasiTab('selesai')">Selesai</button>
                    <button class="btn btn-ghost" id="tabDitolak" onclick="switchAspirasiTab('ditolak')">Ditolak</button>
                </div>

                <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                    <button class="btn btn-purple" id="filterKategoriSemua" onclick="setKategoriFilter('semua')">Semua</button>
                    <button class="btn btn-ghost" id="filterKategoriBelum" onclick="setKategoriFilter('belum')">Belum Kategori</button>
                    <button class="btn btn-ghost" id="filterKategoriAkademik" onclick="setKategoriFilter('Akademik')">Akademik</button>
                    <button class="btn btn-ghost" id="filterKategoriOrganisasi" onclick="setKategoriFilter('Organisasi')">Organisasi</button>
                </div>

                <div id="aspirasiContainer">
                    <div class="empty-state">
                        <div class="empty-text">Memuat data...</div>
                    </div>
                </div>
            </div>
        </div>
    `;

    if (searchNama) {
        document.getElementById("searchNamaAspirasi").value = searchNama;
    }
    document.getElementById("tabMasuk").className = currentTab === "masuk" ? "btn btn-purple" : "btn btn-ghost";
    document.getElementById("tabProses").className = currentTab === "proses" ? "btn btn-purple" : "btn btn-ghost";
    document.getElementById("tabSelesai").className = currentTab === "selesai" ? "btn btn-purple" : "btn btn-ghost";
    document.getElementById("tabDitolak").className = currentTab === "ditolak" ? "btn btn-purple" : "btn btn-ghost";

    document.getElementById("filterKategoriSemua").className = kategoriFilter === "semua" ? "btn btn-purple" : "btn btn-ghost";
    document.getElementById("filterKategoriBelum").className = kategoriFilter === "belum" ? "btn btn-purple" : "btn btn-ghost";
    document.getElementById("filterKategoriAkademik").className = kategoriFilter === "Akademik" ? "btn btn-purple" : "btn btn-ghost";
    document.getElementById("filterKategoriOrganisasi").className = kategoriFilter === "Organisasi" ? "btn btn-purple" : "btn btn-ghost";

    await refreshAspirasiData();
}

function handleSearchNama(val) {
    searchNama = val.trim();
    switchAspirasiTab(currentTab);
}

function setKategoriFilter(type){
    kategoriFilter = type;
    document.getElementById("filterKategoriSemua").className = "btn btn-ghost";
    document.getElementById("filterKategoriBelum").className = "btn btn-ghost";
    document.getElementById("filterKategoriAkademik").className = "btn btn-ghost";
    document.getElementById("filterKategoriOrganisasi").className = "btn btn-ghost";

    if(type == "semua") document.getElementById("filterKategoriSemua").className = "btn btn-purple";
    if(type == "belum") document.getElementById("filterKategoriBelum").className = "btn btn-purple";
    if(type == "Akademik") document.getElementById("filterKategoriAkademik").className = "btn btn-purple";
    if(type == "Organisasi") document.getElementById("filterKategoriOrganisasi").className = "btn btn-purple";

    switchAspirasiTab(currentTab);
}

function switchAspirasiTab(type){
    currentTab = type;
    document.getElementById("tabMasuk").className = "btn btn-ghost";
    document.getElementById("tabProses").className = "btn btn-ghost";
    document.getElementById("tabSelesai").className = "btn btn-ghost";
    document.getElementById("tabDitolak").className = "btn btn-ghost";

    if(type == "masuk") document.getElementById("tabMasuk").className = "btn btn-purple";
    if(type == "proses") document.getElementById("tabProses").className = "btn btn-purple";
    if(type == "selesai") document.getElementById("tabSelesai").className = "btn btn-purple";
    if(type == "ditolak") document.getElementById("tabDitolak").className = "btn btn-purple";

    let filtered = [];
    if(type == "masuk") filtered = allAspirasi.filter(a => a.status?.id == 1);
    if(type == "proses") filtered = allAspirasi.filter(a => a.status?.id == 2);
    if(type == "selesai") filtered = allAspirasi.filter(a => a.status?.id == 3);
    if(type == "ditolak") filtered = allAspirasi.filter(a => a.status?.id == 4);

    if(kategoriFilter == "belum") filtered = filtered.filter(a => !a.kategori);
    if(kategoriFilter == "Akademik") filtered = filtered.filter(a => a.kategori?.namaKategori == "Akademik");
    if(kategoriFilter == "Organisasi") filtered = filtered.filter(a => a.kategori?.namaKategori == "Organisasi");

    if (searchNama) {
        filtered = filtered.filter(a => {
            const author = a.anonim ? "Anonymous" : (a.user?.nama || "Anonymous");
            return author.toLowerCase().includes(searchNama.toLowerCase());
        });
    }

    let sorted = [...filtered];
    if (type === "masuk") {
        sorted.sort((x, y) => new Date(x.tanggal) - new Date(y.tanggal));
    } else {
        sorted.sort((x, y) => new Date(y.tanggal) - new Date(x.tanggal));
    }

    renderAspirasiTab(sorted, type);
}

function renderAspirasiTab(data, type){
    const el = document.getElementById("aspirasiContainer");
    if(!data.length){
        el.innerHTML = `<div class="empty-state"><div class="empty-text">Tidak ada data.</div></div>`;
        return;
    }

    el.innerHTML = `
        <div class="item-list">
            ${[...data].map(a => {
                const sName = a.status?.namaStatus || '-';
                const bClass = {
                    "Pending":"badge-pending",
                    "Diproses":"badge-proses",
                    "Selesai":"badge-selesai",
                    "Ditolak":"badge-ditolak"
                }[sName] || "badge-pending";

                let actions = '';
                if(type == "masuk"){
                    if(!a.kategori){
                        actions = `
                            <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                                <div style="display:flex; gap:0.5rem;">
                                    <button class="btn btn-purple" onclick="event.stopPropagation(); prosesAspirasi(${a.id},1)">Akademik</button>
                                    <button class="btn btn-green" onclick="event.stopPropagation(); prosesAspirasi(${a.id},3)">Organisasi</button>
                                </div>
                                <button class="btn btn-red" onclick="event.stopPropagation(); openFeedbackModal(${a.id},4)">Tolak</button>
                            </div>
                        `;
                    } else {
                        actions = `
                            <div style="display:flex; justify-content:flex-end; gap:0.5rem; width:100%; align-items:center;">
                                <button class="btn btn-orange" onclick="event.stopPropagation(); openFeedbackModal(${a.id},2)">Lanjut</button>
                                <button class="btn btn-red" onclick="event.stopPropagation(); openFeedbackModal(${a.id},4)">Tolak</button>
                            </div>
                        `;
                    }
                }
                if(type == "proses"){
                    actions = `
                        <div style="display:flex; justify-content:flex-end; width:100%; align-items:center;">
                            <button class="btn btn-green" onclick="event.stopPropagation(); openFeedbackModal(${a.id},3)">Tandai Selesai</button>
                        </div>
                    `;
                }

                const fotoGallery = a.fotoPaths && a.fotoPaths.length > 0
                    ? `<div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
                            ${a.fotoPaths.map(path => `<img src="${path}" style="width:65px; height:65px; object-fit:cover; border-radius:6px; cursor:pointer; border:1px solid var(--border);" onclick="event.stopPropagation(); openFullImage('${path}')">`).join('')}
                       </div>`
                    : '';

                return `
                    <div class="item-card" ${type == "selesai" || type == "ditolak" ? `onclick="toggleFeedback(${a.id})"` : ''} style="cursor:${type == "selesai" || type == "ditolak" ? 'pointer' : 'default'};">
                        <div class="item-head">
                            <div class="item-title">${a.isiAspirasi || '(tanpa isi)'}</div>
                            <span class="badge ${bClass}">${sName}</span>
                        </div>
                        <div class="item-metas">
                            <span class="meta-chip">👤 ${a.anonim ? 'Anonymous' : (a.user?.nama || 'Anonymous')}</span>
                            <span class="meta-chip">📁 ${a.kategori?.namaKategori || 'Belum dikategori'}</span>
                            ${a.emailTujuan ? `<span class="meta-chip">📧 ${a.emailTujuan}</span>` : ''}
                        </div>
                        ${fotoGallery}
                        ${(type == "selesai" || type == "ditolak") && a.feedback ? `
                            <div id="feedback-${a.id}" style="display:none; margin-top:16px; padding:14px; border-radius:12px; background:var(--surface3); border:1px solid var(--border); color:var(--muted); line-height:1.6;">
                                <strong style="color:var(--text); display:block; margin-bottom:8px;">Feedback Admin</strong>
                                ${a.feedback}
                            </div>
                        ` : ''}
                        ${actions ? `<div class="item-actions">${actions}</div>` : ''}
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function toggleFeedback(id){
    const el = document.getElementById(`feedback-${id}`);
    if(!el) return;
    el.style.display = el.style.display == "none" ? "block" : "none";
}

async function prosesAspirasi(id, kategoriId){
    if (isProcessingAspirasi) return;
    isProcessingAspirasi = true;
    try{
        await authenticatedFetch(`${API_ASPIRASI}/${id}/proses`, {
            method:"PUT",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({ kategoriId: kategoriId, statusId: 2 })
        });
        showToast("Aspirasi berhasil diproses");
        await refreshAspirasiData();
    }catch{
        showToast("Gagal memproses aspirasi", "error");
    }finally{
        isProcessingAspirasi = false;
    }
}

function openFeedbackModal(id, statusId) {
    document.getElementById("feedbackAspirasiId").value = id;
    document.getElementById("feedbackStatusId").value = statusId;
    document.getElementById("feedbackText").value = "";
    document.getElementById("feedbackModal").style.display = "flex";
    
    const label = document.getElementById("feedbackInputLabel");
    const title = document.getElementById("feedbackModalTitle");
    
    if (statusId == 4) {
        title.innerText = "Tolak Aspirasi";
        label.innerText = "Alasan Penolakan (Wajib)";
        document.getElementById("feedbackText").placeholder = "Tulis alasan mengapa aspirasi ini ditolak...";
    } else if (statusId == 2) {
        title.innerText = "Proses Lanjut Aspirasi";
        label.innerText = "Pesan Penerimaan (Opsional)";
        document.getElementById("feedbackText").placeholder = "Tulis tanggapan awal proses tindak lanjut...";
    } else if (statusId == 3) {
        title.innerText = "Selesaikan Aspirasi";
        label.innerText = "Laporan Penyelesaian / Feedback (Wajib)";
        document.getElementById("feedbackText").placeholder = "Tulis laporan hasil penyelesaian aspirasi...";
    }
}

function closeFeedbackModal() {
    document.getElementById("feedbackModal").style.display = "none";
}

async function submitFeedbackModal() {
    if (isSubmittingFeedback) return;
    const id = document.getElementById("feedbackAspirasiId").value;
    const statusId = parseInt(document.getElementById("feedbackStatusId").value);
    const feedback = document.getElementById("feedbackText").value.trim();
    
    if ((statusId == 4 || statusId == 3) && !feedback) {
        showToast("Feedback/Alasan wajib diisi", "error");
        return;
    }
    
    let finalFeedback = feedback;
    if (statusId == 2 && !feedback) {
        finalFeedback = "Aspirasi kamu telah diterima.";
    }
    
    isSubmittingFeedback = true;
    try {
        await authenticatedFetch(`${API_ASPIRASI}/${id}/feedback`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ statusId, feedback: finalFeedback })
        });
        showToast(statusId == 4 ? "Aspirasi ditolak" : statusId == 3 ? "Aspirasi selesai" : "Aspirasi diproses");
        closeFeedbackModal();
        await refreshAspirasiData();
    } catch {
        showToast("Gagal merespon aspirasi", "error");
    } finally {
        isSubmittingFeedback = false;
    }
}

function openFullImage(path) {
    let overlay = document.getElementById("imgOverlay");
    if (!overlay) {
        overlay = document.createElement("div");
        overlay.id = "imgOverlay";
        overlay.style = "position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:999999; cursor:pointer;";
        overlay.onclick = () => overlay.style.display = "none";
        
        const img = document.createElement("img");
        img.id = "imgOverlaySrc";
        img.style = "max-width:90%; max-height:90%; object-fit:contain; border-radius:8px;";
        overlay.appendChild(img);
        document.body.appendChild(overlay);
    }
    document.getElementById("imgOverlaySrc").src = path;
    overlay.style.display = "flex";
}

async function loadForum(){
    document.getElementById("judulHalaman").textContent = "Kelola Forum";
    document.getElementById("contentArea").innerHTML = `
        <div style="max-width:900px; margin:auto;">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">Topik Diskusi Forum</div>
                </div>
                <div class="panel-body">
                    <div style="display:flex; gap:12px; margin-bottom:20px;">
                        <textarea id="isiPost" class="form-input" placeholder="Tulis topik diskusi baru..." style="min-height:90px; resize:none;"></textarea>
                        <button class="btn btn-purple" onclick="kirimPostAdmin()">Kirim</button>
                    </div>
                    <div id="forumList">
                        <div class="empty-state">
                            <div class="empty-text">Memuat forum...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;

    try{
        const data = await authenticatedFetch(API_FORUM).then(r => r.json());
        allForumPosts = data;
        renderForumAdmin(data);
    }catch{
        showToast("Gagal memuat forum", "error");
    }
}

async function hapusPost(id){
    if(!confirm("Hapus postingan ini?")) return;
    try{
        await authenticatedFetch(`${API_FORUM}/${id}`, { method:"DELETE" });
        showToast("Postingan dihapus");
        loadForum();
    } catch{
        showToast("Gagal menghapus postingan", "error");
    }
}

function renderForumAdmin(data){
    const list = document.getElementById("forumList");
    if(!data.length){
        list.innerHTML = `<div class="empty-state"><div class="empty-text">Belum ada diskusi.</div></div>`;
        return;
    }

    list.innerHTML = `
        <div class="item-list">
            ${[...data].map(post => `
                <div class="item-card">
                    <div class="item-head">
                        <div>
                            <div class="item-title">${post.isiPost}</div>
                            <div style="margin-top:8px; color:var(--muted); font-size:13px;">👤 ${post.user?.nama || 'Anonymous'}</div>
                        </div>
                        <button class="btn btn-red" onclick="hapusPost(${post.id})">Hapus</button>
                    </div>
                    <div style="margin-top:20px;">
                        <button class="btn btn-ghost" onclick="openDiscussionModal(${post.id})">💬 Lihat Diskusi</button>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

let activePostId = null;
let allForumPosts = [];

async function openDiscussionModal(postId) {
    activePostId = postId;
    const post = allForumPosts.find(p => p.id == postId);
    if (!post) return;
    
    document.getElementById("discussionModal").style.display = "flex";
    document.getElementById("modalCommentInput").value = "";
    document.getElementById("modalCommentInput").setAttribute("data-parent", "");
    
    await loadModalComments();
}

function closeDiscussionModal() {
    document.getElementById("discussionModal").style.display = "none";
    activePostId = null;
}

async function loadModalComments() {
    if (!activePostId) return;
    const post = allForumPosts.find(p => p.id == activePostId);
    const contentArea = document.getElementById("discussionModalContent");
    
    let html = `
        <div style="padding-bottom:16px; border-bottom:1px solid var(--border);">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                <div class="user-avatar" style="width:32px; height:32px; font-size:12px;">${(post.user?.nama || "M").charAt(0).toUpperCase()}</div>
                <div>
                    <div style="font-weight:700; font-size:14px; color:var(--text);">${post.user?.nama || 'Anonymous'}</div>
                </div>
            </div>
            <div style="font-size:14px; color:var(--text); line-height:1.6; word-break:break-word;">
                ${post.isiPost}
            </div>
        </div>
        <div style="font-weight:800; font-size:13px; color:var(--text); margin-top:10px; margin-bottom:4px;">Komentar</div>
        <div id="modalCommentTree" style="display:flex; flex-direction:column; gap:12px;">
            <p style="text-align:center; color:var(--muted); font-size:13px; padding:20px 0;">Memuat komentar...</p>
        </div>
    `;
    
    contentArea.innerHTML = html;
    
    try {
        const comments = await authenticatedFetch(`/api/forum-comment/${activePostId}`).then(r => r.json());
        const treeArea = document.getElementById("modalCommentTree");
        if (!comments.length) {
            treeArea.innerHTML = `<p style="text-align:center; color:var(--muted); font-size:13px; padding:20px 0;">Belum ada komentar.</p>`;
            return;
        }
        treeArea.innerHTML = renderKomentarTree(comments, 0);
    } catch (e) {
        document.getElementById("modalCommentTree").innerHTML = `<p style="text-align:center; color:var(--muted); font-size:13px; padding:20px 0;">Gagal memuat komentar.</p>`;
    }
}

function renderKomentarTree(comments, level = 0) {
    return comments.map(c => {
        const borderStyle = level > 0 
            ? 'border-left: 2px solid var(--border); padding-left: 14px; margin-left: 8px;' 
            : 'background:var(--surface2); border:1px solid var(--border); padding:12px; border-radius:12px;';
        
        let repliesHtml = '';
        if (c.replies && c.replies.length > 0) {
            repliesHtml = `
                <div style="margin-top:6px;">
                    ${renderKomentarTree(c.replies, level + 1)}
                </div>`;
        }

        return `
        <div style="${borderStyle} margin-top: 6px;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                <div>
                    <div style="font-weight:700; font-size:12px; color:var(--text);">${c.namaUser}</div>
                    <div style="font-size:13px; color:var(--text-soft); margin-top:2px; word-break:break-word; line-height:1.5;">${c.isiKomentar}</div>
                </div>
                <div style="display:flex; gap:6px; flex-shrink:0;">
                    <button class="btn btn-ghost" style="padding:2px 6px; font-size:10px;" onclick="replyComment(${c.id}, '${c.namaUser}')">Balas</button>
                    <button class="btn btn-red" style="padding:2px 6px; font-size:10px;" onclick="hapusKomentar(${c.id})">Hapus</button>
                </div>
            </div>
            ${repliesHtml}
        </div>`;
    }).join('');
}

function replyComment(commentId, namaUser) {
    const input = document.getElementById("modalCommentInput");
    input.focus();
    input.value = `@${namaUser} `;
    input.setAttribute("data-parent", commentId);
}

async function sendModalComment() {
    const input = document.getElementById("modalCommentInput");
    const isiKomentar = input.value;
    if (!isiKomentar.trim()) return;
    
    const parentId = input.getAttribute("data-parent");
    const body = {
        isiKomentar,
        post: { id: activePostId },
        user: { id: user.id }
    };
    
    if (parentId) {
        body.parentComment = { id: parentId };
    }
    
    try {
        await authenticatedFetch("/api/forum-comment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        input.value = "";
        input.setAttribute("data-parent", "");
        await loadModalComments();
    } catch (e) {
        showToast("Gagal mengirim komentar", "error");
    }
}

async function hapusKomentar(commentId) {
    if (!confirm("Hapus komentar ini?")) return;
    try {
        await authenticatedFetch(`/api/forum-comment/${commentId}`, { method: "DELETE" });
        await loadModalComments();
    } catch (e) {
        showToast("Gagal menghapus komentar", "error");
    }
}

async function kirimPostAdmin(){
    const isi = document.getElementById("isiPost").value;
    if(!isi.trim()) return;

    try{
        await authenticatedFetch(API_FORUM,{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ isiPost:isi, user:{ id:user.id } })
        });
        showToast("Topik berhasil dibuat");
        document.getElementById("isiPost").value = "";
        loadForum();
    }catch{
        showToast("Gagal membuat topik", "error");
    }
}


async function loadUser(){
    document.getElementById("judulHalaman").textContent="Kelola User";
    document.getElementById("contentArea").innerHTML=`
        <div class="panel" style="margin-bottom:1.5rem">
            <div class="panel-header"><div class="panel-title">➕ Tambah User</div></div>
            <div class="panel-body">
                <div class="form-grid">
                    <input id="namaUser" class="form-input" placeholder="Nama lengkap">
                    <input id="emailUser" class="form-input" placeholder="Email" type="email">
                    <input id="passwordUser" class="form-input" placeholder="Password" type="password">
                    <select id="roleUser" class="form-select">
                        <option value="MAHASISWA">MAHASISWA</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                    <button class="btn btn-solid" onclick="tambahUser()" style="width:100%;justify-content:center">➕ Tambah User</button>
                </div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header"><div class="panel-title">Daftar User</div></div>
            <div class="panel-body"><div id="userList"><div class="empty-state"><span class="empty-icon">⏳</span><div class="empty-text">Memuat data...</div></div></div></div>
        </div>`;
    await refreshUserTable();
}

async function refreshUserTable(){
    try{
        const data=await authenticatedFetch(API_USER).then(r=>r.json());
        const list=document.getElementById("userList");
        if(!data.length){
            list.innerHTML=`<div class="empty-state"><span class="empty-icon">👥</span><div class="empty-text">Belum ada user.</div></div>`;
            return;
        }
        list.innerHTML=`<table class="data-table"><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Aksi</th></tr></thead><tbody>${data.map(u=>`
            <tr>
                <td style="font-weight:600">${u.nama}</td>
                <td style="color:var(--muted)">${u.email}</td>
                <td><span class="badge badge-proses">${u.role}</span></td>
                <td><div style="display:flex;gap:.4rem">
                    <button class="btn btn-ghost" onclick="editUser(${u.id},'${u.nama}','${u.email}','${u.role}')">✏ Edit</button>
                    <button class="btn btn-red" onclick="hapusUser(${u.id})">🗑 Hapus</button>
                </div></td>
            </tr>`).join('')}</tbody></table>`;
    }catch{
        document.getElementById("userList").innerHTML=`<div class="empty-state"><span class="empty-icon">❌</span><div class="empty-text">Gagal memuat data.</div></div>`;
        showToast("Gagal memuat user","error");
    }
}

async function tambahUser(){
    const nama=document.getElementById("namaUser").value.trim();
    const email=document.getElementById("emailUser").value.trim();
    const password=document.getElementById("passwordUser").value.trim();
    const role=document.getElementById("roleUser").value;
    if(!nama||!email||!password){
        showToast("Semua field wajib diisi","error");
        return;
    }
    try{
        const res=await authenticatedFetch(API_USER,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({nama,email,password,role})
        });
        if(!res.ok) throw new Error();
        showToast("User berhasil ditambahkan");
        ["namaUser","emailUser","passwordUser"].forEach(id=>document.getElementById(id).value="");
        await refreshUserTable();
    }catch{
        showToast("Gagal menambahkan user","error");
    }
}

function editUser(id, nama, email, role){
    document.getElementById("userModal").style.display = "flex";
    document.getElementById("editUserId").value = id;
    document.getElementById("editNama").value = nama;
    document.getElementById("editEmail").value = email;
    document.getElementById("editRole").value = role;
    document.getElementById("editPassword").value = "";
}

function closeUserModal(){
    document.getElementById("userModal").style.display = "none";
}

async function saveEditUser(){
    const id = document.getElementById("editUserId").value;
    const nama = document.getElementById("editNama").value;
    const email = document.getElementById("editEmail").value;
    const password = document.getElementById("editPassword").value;
    const role = document.getElementById("editRole").value;

    try{
        const body = { nama, email, role };
        if(password.trim()){
            body.password = password;
        }

        const res = await authenticatedFetch(`${API_USER}/${id}`, {
            method:"PUT",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(body)
        });

        if(!res.ok) throw new Error();
        showToast("User berhasil diupdate");
        closeUserModal();
        refreshUserTable();
    }catch{
        showToast("Gagal update user", "error");
    }
}

async function hapusUser(id){
    if(!confirm("Yakin ingin menghapus user ini?")) return;

    try{
        const res = await authenticatedFetch(`${API_USER}/${id}`, { method:"DELETE" });
        if(!res.ok){
            const err = await res.text();
            throw new Error(err);
        }
        showToast("User berhasil dihapus");
        refreshUserTable();
    }catch(err){
        showToast("Gagal menghapus user", "error");
    }
}
