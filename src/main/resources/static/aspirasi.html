<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe - Buat Aspirasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ── LIGHT THEME (default) ── */
        :root,
        [data-theme="light"] {
            --navy: #0f1f3d;
            --teal: #0e9f8e;
            --teal-light: #12b5a2;
            --cream: #f7f6f2;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f7f6f2;
            --surface: #ffffff;
            --surface2: #f3f4f6;
            --text: #1f2937;
            --nav-bg: #ffffff;
            --nav-shadow: 0 1px 8px rgba(15,31,61,0.06);
            --card-shadow: 0 1px 4px rgba(0,0,0,0.04);
            --input-bg: #ffffff;
            --anon-bg: #f7f6f2;
            --toggle-track: #e5e7eb;
            --toggle-thumb: #0e9f8e;
            --toggle-pos: 2px;
            --msg-success-bg: #f0fdf4;
            --msg-success-border: #bbf7d0;
            --msg-success-color: #15803d;
            --msg-error-bg: #fef2f2;
            --msg-error-border: #fecaca;
            --msg-error-color: #dc2626;
        }

        /* ── DARK THEME ── */
        [data-theme="dark"] {
            --navy: #e2e8f0;
            --teal: #2dd4bf;
            --teal-light: #5eead4;
            --cream: #0a0a0f;
            --muted: #7a7a9a;
            --border: rgba(255,255,255,0.08);
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #1a1a24;
            --text: #f0eff8;
            --nav-bg: rgba(17,17,24,0.92);
            --nav-shadow: 0 1px 8px rgba(0,0,0,0.35);
            --card-shadow: 0 4px 24px rgba(0,0,0,0.3);
            --input-bg: #1a1a24;
            --anon-bg: #1a1a24;
            --toggle-track: #22222f;
            --toggle-thumb: #6c63ff;
            --toggle-pos: 24px;
            --msg-success-bg: rgba(45,201,106,0.08);
            --msg-success-border: rgba(45,201,106,0.25);
            --msg-success-color: #86efac;
            --msg-error-bg: rgba(239,68,68,0.08);
            --msg-error-border: rgba(239,68,68,0.25);
            --msg-error-color: #fca5a5;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            transition: background 0.35s ease, color 0.35s ease;
        }

        /* ── NAV ── */
        .tm-nav {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            box-shadow: var(--nav-shadow);
            backdrop-filter: blur(16px);
            transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }
        .tm-nav .inner {
            display: flex; align-items: center; height: 64px;
            max-width: 1200px; margin: auto; padding: 0 24px;
        }
        .tm-brand {
            font-family: 'Sora', sans-serif; font-size: 1.35rem; font-weight: 700;
            color: var(--navy); text-decoration: none; letter-spacing: -0.02em;
            margin-right: 40px; flex-shrink: 0;
            transition: color 0.35s ease;
        }
        .tm-brand span { color: var(--teal); }
        .tm-links { display: flex; align-items: center; gap: 2px; flex: 1; }
        .tm-links a {
            color: var(--muted); text-decoration: none; font-size: 0.87rem;
            font-weight: 500; padding: 7px 13px; border-radius: 8px;
            transition: color 0.15s, background 0.15s; white-space: nowrap;
        }
        .tm-links a:hover { color: var(--navy); background: var(--surface2); }
        .tm-links a.active { color: var(--teal); background: rgba(14,159,142,0.09); font-weight: 600; }
        [data-theme="dark"] .tm-links a:hover { color: var(--text); }
        [data-theme="dark"] .tm-links a.active { background: rgba(45,212,191,0.1); }

        .tm-user { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .tm-hello { font-size: 0.84rem; color: var(--muted); transition: color 0.35s ease; }
        .tm-hello strong { color: var(--navy); transition: color 0.35s ease; }
        .btn-logout {
            background: transparent; border: 1.5px solid var(--border);
            border-radius: 8px; padding: 6px 14px; font-size: 0.82rem;
            font-weight: 600; color: var(--muted); cursor: pointer;
            transition: all 0.15s; font-family: 'DM Sans', sans-serif;
        }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

        /* ── THEME TOGGLE ── */
        .theme-toggle {
            display: flex; align-items: center; gap: .5rem;
            cursor: pointer; user-select: none; flex-shrink: 0;
        }
        .theme-toggle-label {
            font-size: 0.8rem; font-weight: 600; color: var(--muted);
            transition: color 0.2s; white-space: nowrap;
        }
        .toggle-track {
            position: relative; width: 44px; height: 22px;
            background: var(--toggle-track); border: 1px solid var(--border);
            border-radius: 100px; transition: all 0.3s ease; flex-shrink: 0;
        }
        .toggle-thumb {
            position: absolute; top: 2px; left: var(--toggle-pos);
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--toggle-thumb);
            box-shadow: 0 0 6px rgba(14,159,142,0.4);
            transition: left 0.3s cubic-bezier(.34,1.56,.64,1), background 0.3s ease, box-shadow 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.55rem;
        }
        [data-theme="dark"] .toggle-thumb { box-shadow: 0 0 8px rgba(108,99,255,0.5); }

        /* ── PAGE ── */
        .page-wrap { max-width: 800px; margin: 40px auto; padding: 0 24px; }
        .page-header { margin-bottom: 28px; }
        .page-header h2 {
            font-family: 'Sora', sans-serif; font-size: 1.7rem; font-weight: 700;
            color: var(--navy); letter-spacing: -0.02em; margin-bottom: 4px;
            transition: color 0.35s ease;
        }
        .page-header p { color: var(--muted); font-size: 0.88rem; margin: 0; transition: color 0.35s ease; }

        /* ── CARD ── */
        .card-tm {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 32px;
            box-shadow: var(--card-shadow);
            transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }

        /* ── FORM ── */
        .form-label {
            font-size: 0.78rem; font-weight: 500; color: var(--navy);
            margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase;
            display: block; transition: color 0.35s ease;
        }
        .form-control {
            border: 1.5px solid var(--border); border-radius: 10px;
            padding: 12px 16px; font-size: 0.93rem; color: var(--text);
            background: var(--input-bg); width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.35s ease, color 0.35s ease;
            font-family: 'DM Sans', sans-serif;
        }
        .form-control::placeholder { color: var(--muted); }
        .form-control:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(14,159,142,0.12);
            outline: none;
        }
        [data-theme="dark"] .form-control:focus { box-shadow: 0 0 0 3px rgba(45,212,191,0.12); }
        textarea.form-control { resize: vertical; min-height: 160px; line-height: 1.6; }

        /* ── ANON CHECKBOX ── */
        .anon-check {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 16px; background: var(--anon-bg);
            border-radius: 10px; cursor: pointer; margin-top: 16px;
            border: 1px solid var(--border);
            transition: background 0.35s ease, border-color 0.35s ease;
        }
        .anon-check input { width: 18px; height: 18px; accent-color: var(--teal); cursor: pointer; }
        .anon-check label { font-size: 0.88rem; color: var(--navy); cursor: pointer; margin: 0; transition: color 0.35s ease; }
        .anon-check small { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 2px; transition: color 0.35s ease; }

        /* ── SUBMIT BUTTON ── */
        .btn-kirim {
            background: var(--teal); color: #fff; border: none;
            border-radius: 10px; padding: 13px 32px;
            font-family: 'Sora', sans-serif; font-weight: 600; font-size: 0.93rem;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
            width: 100%; margin-top: 20px;
        }
        .btn-kirim:hover { background: var(--teal-light); transform: translateY(-1px); }

        /* ── MESSAGE BOX ── */
        .msg-box { border-radius: 10px; padding: 12px 16px; font-size: 0.85rem; margin-top: 14px; display: none; }
        .msg-box.success {
            background: var(--msg-success-bg); border: 1px solid var(--msg-success-border);
            color: var(--msg-success-color); display: block;
        }
        .msg-box.error {
            background: var(--msg-error-bg); border: 1px solid var(--msg-error-border);
            color: var(--msg-error-color); display: block;
        }

        .char-count { text-align: right; font-size: 0.75rem; color: var(--muted); margin-top: 6px; transition: color 0.35s ease; }
    </style>
</head>
<body>

<script>
(function() {
    const saved = localStorage.getItem('tellme-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
})();
</script>

<script>
const user = JSON.parse(localStorage.getItem("user") || '{"nama":"Byantara","role":"MAHASISWA","id":1}');
// if(!user) window.location.href="/login.html";
// if(user&&user.role==="ADMIN") window.location.href="/admin.html";
window.onload = function() {
    document.querySelectorAll(".namaUser").forEach(el => el.innerText = user.nama);
    applyThemeUI(document.documentElement.getAttribute('data-theme') || 'light');
}
</script>

<nav class="tm-nav">
    <div class="inner">
        <a class="tm-brand" href="/index.html">Tell<span>Me</span></a>
        <div class="tm-links">
            <a href="/index.html">Beranda</a>
            <a href="/aspirasi.html" class="active">Buat Aspirasi</a>
            <a href="/forum.html">Forum</a>
            <a href="/riwayat.html">Riwayat Aspirasi</a>
            <a href="/profile.html">Profil</a>
        </div>
        <div class="tm-user">
            <div class="theme-toggle" onclick="toggleTheme()" title="Ganti tema">
                <div class="toggle-track">
                    <div class="toggle-thumb" id="toggleThumb">
                        <span id="toggleIcon">☀️</span>
                    </div>
                </div>
                <span class="theme-toggle-label" id="themeLabel">Terang</span>
            </div>
            <div class="tm-hello">Halo, <strong class="namaUser"></strong></div>
            <button class="btn-logout" onclick="logout()">Keluar</button>
        </div>
    </div>
</nav>

<div class="page-wrap">
    <div class="page-header">
        <h2>Buat Aspirasi</h2>
        <p>Sampaikan kritik, saran, atau masukan kamu kepada pihak kampus.</p>
    </div>
    <div class="card-tm">
        <div class="mb-3" style="margin-bottom:1rem">
            <label class="form-label">Isi Aspirasi</label>
            <textarea id="isiAspirasi" class="form-control" rows="7"
                placeholder="Tulis aspirasi kamu di sini..." oninput="updateCount()"></textarea>
            <div class="char-count"><span id="charCount">0</span> karakter</div>
        </div>
        <div class="anon-check">
            <input type="checkbox" id="anonim">
            <div>
                <label for="anonim" style="font-weight:500">Kirim sebagai anonim</label>
                <small>Nama kamu tidak akan ditampilkan kepada admin</small>
            </div>
        </div>
        <button class="btn-kirim" onclick="kirimAspirasi()">Kirim Aspirasi →</button>
        <div id="message" class="msg-box"></div>
    </div>
</div>

<script>
const API = "http://localhost:8080/api/aspirasi";

function logout() { localStorage.removeItem("user"); window.location.href = "/login.html"; }
function updateCount() { document.getElementById("charCount").innerText = document.getElementById("isiAspirasi").value.length; }

/* ── THEME ── */
function applyThemeUI(theme) {
    const isLight = theme === 'light';
    document.getElementById('themeLabel').textContent = isLight ? 'Terang' : 'Gelap';
    document.getElementById('toggleIcon').textContent = isLight ? '☀️' : '🌙';
}

function toggleTheme() {
    const html    = document.documentElement;
    const current = html.getAttribute('data-theme') || 'light';
    const next    = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tellme-theme', next);
    applyThemeUI(next);
}

/* ── KIRIM ── */
async function kirimAspirasi() {
    const isiAspirasi = document.getElementById("isiAspirasi").value;
    const anonim = document.getElementById("anonim").checked;
    const msg = document.getElementById("message");
    msg.className = "msg-box";

    if (!isiAspirasi.trim()) {
        msg.className = "msg-box error";
        msg.innerText = "Isi aspirasi terlebih dahulu.";
        return;
    }

    try {
        const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ isiAspirasi, anonim, user: { id: user.id } })
        });

        if (!res.ok) {
            const err = await res.text();
            msg.className = "msg-box error";
            msg.innerText = "Gagal mengirim: " + (err || res.status);
            return;
        }

        msg.className = "msg-box success";
        msg.innerText = "✓ Aspirasi berhasil dikirim!";
        document.getElementById("isiAspirasi").value = "";
        document.getElementById("anonim").checked = false;
        document.getElementById("charCount").innerText = "0";

    } catch (e) {
        msg.className = "msg-box error";
        msg.innerText = "Gagal mengirim aspirasi. Pastikan server berjalan.";
    }
}
</script>
</body>
</html>
