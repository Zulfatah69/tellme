<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe - Riwayat Aspirasi</title>
    <script src="/js/auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root,
        [data-theme="light"] {
            --navy: #0f1f3d;
            --teal: #0e9f8e;
            --teal-light: #12b5a2;
            --cream: #f7f6f2;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f7f6f2;
            --surface: #ffffff;
            --surface2: #f3f4f6;
            --text: #1f2937;
            --text-soft: #374151;
            --nav-bg: #ffffff;
            --nav-shadow: 0 1px 8px rgba(15,31,61,0.06);
            --card-shadow-hover: 0 4px 20px rgba(15,31,61,0.08);
            --aspirasi-text-bg: #f7f6f2;
            --count-badge-bg: #0f1f3d;
            --count-badge-color: #ffffff;
            --feedback-bg: rgba(14,159,142,0.06);
            --feedback-border: rgba(14,159,142,0.15);
            --feedback-text: #374151;
            --toggle-track: #e5e7eb;
            --toggle-thumb: #0e9f8e;
            --toggle-pos: 2px;
            --badge-proses-bg: #fef9c3; --badge-proses-color: #92400e; --badge-proses-border: #fde68a;
            --badge-selesai-bg: #f0fdf4; --badge-selesai-color: #15803d; --badge-selesai-border: #bbf7d0;
            --badge-ditolak-bg: #fef2f2; --badge-ditolak-color: #dc2626; --badge-ditolak-border: #fecaca;
        }

        [data-theme="dark"] {
            --navy: #e2e8f0;
            --teal: #2dd4bf;
            --teal-light: #5eead4;
            --cream: #0a0a0f;
            --muted: #7a7a9a;
            --border: rgba(255,255,255,0.08);
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #1a1a24;
            --text: #f0eff8;
            --text-soft: #cbd5e1;
            --nav-bg: rgba(17,17,24,0.92);
            --nav-shadow: 0 1px 8px rgba(0,0,0,0.35);
            --card-shadow-hover: 0 4px 24px rgba(0,0,0,0.4);
            --aspirasi-text-bg: #1a1a24;
            --count-badge-bg: #22222f;
            --count-badge-color: #e2e8f0;
            --feedback-bg: rgba(45,212,191,0.06);
            --feedback-border: rgba(45,212,191,0.15);
            --feedback-text: #cbd5e1;
            --toggle-track: #22222f;
            --toggle-thumb: #6c63ff;
            --toggle-pos: 24px;
            --badge-proses-bg: rgba(251,191,36,0.1); --badge-proses-color: #fcd34d; --badge-proses-border: rgba(251,191,36,0.25);
            --badge-selesai-bg: rgba(74,222,128,0.1); --badge-selesai-color: #86efac; --badge-selesai-border: rgba(74,222,128,0.25);
            --badge-ditolak-bg: rgba(239,68,68,0.1); --badge-ditolak-color: #fca5a5; --badge-ditolak-border: rgba(239,68,68,0.25);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            transition: background 0.35s ease, color 0.35s ease;
        }

        .tm-nav {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            box-shadow: var(--nav-shadow);
            backdrop-filter: blur(16px);
            transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }
        .tm-nav .inner {
            display: flex; align-items: center; height: 64px;
            max-width: 1200px; margin: auto; padding: 0 24px;
        }
        .tm-brand {
            font-family: 'Sora', sans-serif; font-size: 1.35rem; font-weight: 700;
            color: var(--navy); text-decoration: none; letter-spacing: -0.02em;
            margin-right: 40px; flex-shrink: 0; transition: color 0.35s ease;
        }
        .tm-brand span { color: var(--teal); }
        .tm-links { display: flex; align-items: center; gap: 2px; flex: 1; }
        .tm-links a {
            color: var(--muted); text-decoration: none; font-size: 0.87rem;
            font-weight: 500; padding: 7px 13px; border-radius: 8px;
            transition: color 0.15s, background 0.15s; white-space: nowrap;
        }
        .tm-links a:hover { color: var(--navy); background: var(--surface2); }
        .tm-links a.active { color: var(--teal); background: rgba(14,159,142,0.09); font-weight: 600; }
        [data-theme="dark"] .tm-links a:hover { color: var(--text); }
        [data-theme="dark"] .tm-links a.active { background: rgba(45,212,191,0.1); }

        .tm-user { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .tm-hello { font-size: 0.84rem; color: var(--muted); transition: color 0.35s ease; }
        .tm-hello strong { color: var(--navy); transition: color 0.35s ease; }
        .btn-logout {
            background: transparent; border: 1.5px solid var(--border);
            border-radius: 8px; padding: 6px 14px; font-size: 0.82rem;
            font-weight: 600; color: var(--muted); cursor: pointer;
            transition: all 0.15s; font-family: 'DM Sans', sans-serif;
        }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

        .theme-toggle {
            display: flex; align-items: center; gap: .5rem;
            cursor: pointer; user-select: none; flex-shrink: 0;
        }
        .theme-toggle-label {
            font-size: 0.8rem; font-weight: 600; color: var(--muted);
            transition: color 0.2s; white-space: nowrap;
        }
        .toggle-track {
            position: relative; width: 44px; height: 22px;
            background: var(--toggle-track); border: 1px solid var(--border);
            border-radius: 100px; transition: all 0.3s ease; flex-shrink: 0;
        }
        .toggle-thumb {
            position: absolute; top: 2px; left: var(--toggle-pos);
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--toggle-thumb);
            box-shadow: 0 0 6px rgba(14,159,142,0.4);
            transition: left 0.3s cubic-bezier(.34,1.56,.64,1), background 0.3s ease, box-shadow 0.3s ease;
            display: flex; align-items: center; justify-content: center; font-size: 0.55rem;
        }
        [data-theme="dark"] .toggle-thumb { box-shadow: 0 0 8px rgba(108,99,255,0.5); }

        .page-wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
        .page-header {
            margin-bottom: 24px; display: flex;
            align-items: flex-end; justify-content: space-between;
        }
        .page-header h2 {
            font-family: 'Sora', sans-serif; font-size: 1.7rem; font-weight: 700;
            color: var(--navy); letter-spacing: -0.02em; margin-bottom: 4px;
            transition: color 0.35s ease;
        }
        .page-header p { color: var(--muted); font-size: 0.88rem; margin: 0; transition: color 0.35s ease; }

        .count-badge {
            background: var(--count-badge-bg); color: var(--count-badge-color);
            font-family: 'Sora', sans-serif; font-size: 0.78rem; font-weight: 700;
            padding: 4px 12px; border-radius: 20px;
            border: 1px solid var(--border);
            transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
        }

        .aspirasi-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 24px; margin-bottom: 14px;
            transition: box-shadow 0.15s, background 0.35s ease, border-color 0.35s ease;
        }
        .aspirasi-card:hover { box-shadow: var(--card-shadow-hover); }
        .card-top {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .card-title {
            font-family: 'Sora', sans-serif; font-size: 0.9rem;
            font-weight: 700; color: var(--navy); transition: color 0.35s ease;
        }

        .badge-status {
            font-size: 0.75rem; font-weight: 600; padding: 4px 12px;
            border-radius: 20px; font-family: 'Sora', sans-serif;
            transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
        }
        .badge-diproses {
            background: var(--badge-proses-bg); color: var(--badge-proses-color);
            border: 1px solid var(--badge-proses-border);
        }
        .badge-selesai {
            background: var(--badge-selesai-bg); color: var(--badge-selesai-color);
            border: 1px solid var(--badge-selesai-border);
        }
        .badge-ditolak {
            background: var(--badge-ditolak-bg); color: var(--badge-ditolak-color);
            border: 1px solid var(--badge-ditolak-border);
        }

        .aspirasi-text {
            font-size: 0.9rem; color: var(--text-soft); line-height: 1.65;
            margin-bottom: 14px; padding: 14px;
            background: var(--aspirasi-text-bg); border-radius: 8px;
            transition: background 0.35s ease, color 0.35s ease;
        }
        .meta-row { display: flex; gap: 24px; flex-wrap: wrap; }
        .meta-item { font-size: 0.8rem; color: var(--muted); transition: color 0.35s ease; }
        .meta-item strong { color: var(--navy); font-weight: 600; transition: color 0.35s ease; }

        .feedback-box {
            margin-top: 12px; padding: 12px 14px;
            background: var(--feedback-bg); border: 1px solid var(--feedback-border);
            border-radius: 8px; font-size: 0.83rem; color: var(--feedback-text);
            transition: background 0.35s ease, border-color 0.35s ease, color 0.35s ease;
        }
        .feedback-box .fb-label {
            font-family: 'Sora', sans-serif; font-weight: 700;
            font-size: 0.76rem; color: var(--teal); margin-bottom: 4px;
            transition: color 0.35s ease;
        }

        .empty-state { text-align: center; padding: 80px 0; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
        .empty-state h5 {
            font-family: 'Sora', sans-serif; color: var(--navy);
            font-size: 1.1rem; margin-bottom: 8px; transition: color 0.35s ease;
        }
        .empty-state p { color: var(--muted); font-size: 0.87rem; transition: color 0.35s ease; }
        .empty-state a {
            display: inline-block; margin-top: 16px; background: var(--teal);
            color: #fff; text-decoration: none; padding: 10px 24px;
            border-radius: 8px; font-weight: 600; font-size: 0.88rem;
            transition: background 0.2s ease;
        }
        .empty-state a:hover { background: var(--teal-light); }
    </style>
</head>
<body>

<script>
(function() {
    const saved = localStorage.getItem('tellme-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
})();
</script>

<script>
const user = JSON.parse(localStorage.getItem("user"));
window.onload = function() {
    document.querySelectorAll(".namaUser").forEach(el => el.innerText = user.nama);
    applyThemeUI(document.documentElement.getAttribute('data-theme') || 'light');
}
</script>

<nav class="tm-nav">
    <div class="inner">
        <a class="tm-brand" href="/index.html">Tell<span>Me</span></a>
        <div class="tm-links">
            <a href="/index.html">Beranda</a>
            <a href="/aspirasi.html">Buat Aspirasi</a>
            <a href="/forum.html">Forum</a>
            <a href="/riwayat.html" class="active">Riwayat Aspirasi</a>
            <a href="/profile.html">Profil</a>
        </div>
        <div class="tm-user">
            <div class="theme-toggle" onclick="toggleTheme()" title="Ganti tema">
                <div class="toggle-track">
                    <div class="toggle-thumb" id="toggleThumb">
                        <span id="toggleIcon">☀️</span>
                    </div>
                </div>
                <span class="theme-toggle-label" id="themeLabel">Terang</span>
            </div>
            <div class="tm-hello">Halo, <strong class="namaUser"></strong></div>
            <button class="btn-logout" onclick="logout()">Keluar</button>
        </div>
    </div>
</nav>

<div class="page-wrap">
    <div class="page-header">
        <div>
            <h2>Riwayat Aspirasi</h2>
            <p>Semua aspirasi yang pernah kamu kirim</p>
        </div>
        <div class="count-badge" id="countBadge">0 Aspirasi</div>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
        <select id="filterStatus" class="form-select" onchange="applyFilters()" style="flex: 1; min-width: 140px; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; background: var(--surface); color: var(--text);">
            <option value="semua">Semua Status</option>
            <option value="1">Masuk</option>
            <option value="2">Diproses</option>
            <option value="3">Selesai</option>
            <option value="4">Ditolak</option>
        </select>
        <select id="filterKategori" class="form-select" onchange="applyFilters()" style="flex: 1; min-width: 140px; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; background: var(--surface); color: var(--text);">
            <option value="semua">Semua Kategori</option>
            <option value="Akademik">Akademik</option>
            <option value="Organisasi">Organisasi</option>
            <option value="belum">Belum Kategori</option>
        </select>
        <select id="filterAnonim" class="form-select" onchange="applyFilters()" style="flex: 1; min-width: 140px; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; background: var(--surface); color: var(--text);">
            <option value="semua">Semua Pengiriman</option>
            <option value="anonim">Anonim</option>
            <option value="non-anonim">Non-Anonim (Nama Terlihat)</option>
        </select>
    </div>

    <div id="listRiwayat"></div>
</div>

<script>
const API = "/api/aspirasi/my";
let allData = [];

async function logout() {
    try {
        await authenticatedFetch("/api/auth/logout", { method: "POST" });
    } catch (e) {
        console.error("Gagal logout di server:", e);
    }
    localStorage.removeItem("user");
    window.location.href = "/login.html";
}

function formatTgl(t) {
    if (!t) return '-';
    return new Date(t).toLocaleDateString("id-ID", { day: 'numeric', month: 'long', year: 'numeric' });
}

function applyThemeUI(theme) {
    const isLight = theme === 'light';
    document.getElementById('themeLabel').textContent = isLight ? 'Terang' : 'Gelap';
    document.getElementById('toggleIcon').textContent = isLight ? '☀️' : '🌙';
}

function toggleTheme() {
    const html    = document.documentElement;
    const current = html.getAttribute('data-theme') || 'light';
    const next    = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tellme-theme', next);
    applyThemeUI(next);
}

function openFullImage(path) {
    let overlay = document.getElementById("imgOverlay");
    if (!overlay) {
        overlay = document.createElement("div");
        overlay.id = "imgOverlay";
        overlay.style = "position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:999999; cursor:pointer;";
        overlay.onclick = () => overlay.style.display = "none";
        
        const img = document.createElement("img");
        img.id = "imgOverlaySrc";
        img.style = "max-width:90%; max-height:90%; object-fit:contain; border-radius:8px;";
        overlay.appendChild(img);
        document.body.appendChild(overlay);
    }
    document.getElementById("imgOverlaySrc").src = path;
    overlay.style.display = "flex";
}

async function loadRiwayat() {
    try {
        const res  = await authenticatedFetch(API);
        allData   = await res.json();
        
        allData.sort((x, y) => new Date(y.tanggal) - new Date(x.tanggal));
        
        applyFilters();
    } catch (e) {
        console.error(e);
        document.getElementById("listRiwayat").innerHTML = `
            <div class="empty-state">
                <div class="icon">❌</div>
                <h5>Gagal memuat data</h5>
                <p>Pastikan server berjalan dan coba lagi.</p>
            </div>`;
    }
}

function applyFilters() {
    const statusVal = document.getElementById("filterStatus").value;
    const kategoriVal = document.getElementById("filterKategori").value;
    const anonimVal = document.getElementById("filterAnonim").value;
    
    let filtered = [...allData];
    
    if (statusVal !== "semua") {
        filtered = filtered.filter(a => a.status?.id == parseInt(statusVal));
    }
    
    if (kategoriVal !== "semua") {
        if (kategoriVal === "belum") {
            filtered = filtered.filter(a => !a.kategori);
        } else {
            filtered = filtered.filter(a => a.kategori?.namaKategori === kategoriVal);
        }
    }
    
    if (anonimVal !== "semua") {
        const isAnon = anonimVal === "anonim";
        filtered = filtered.filter(a => a.anonim === isAnon);
    }
    
    document.getElementById("countBadge").innerText = filtered.length + " Aspirasi";
    
    if (!filtered.length) {
        document.getElementById("listRiwayat").innerHTML = `
            <div class="empty-state">
                <div class="icon">📭</div>
                <h5>Tidak ada aspirasi</h5>
                <p>Tidak ditemukan aspirasi yang sesuai dengan filter.</p>
            </div>`;
        return;
    }
    
    let html = "";
    filtered.forEach(a => {
        let badge = "";
        if (a.status?.id == 1)      badge = '<span class="badge-status badge-diproses" style="background:var(--border); color:var(--text-soft);">Masuk</span>';
        else if (a.status?.id == 2) badge = '<span class="badge-status badge-diproses">Diproses</span>';
        else if (a.status?.id == 3) badge = '<span class="badge-status badge-selesai">✓ Selesai</span>';
        else if (a.status?.id == 4) badge = '<span class="badge-status badge-ditolak">Ditolak</span>';

        const feedback = a.feedback
            ? `<div class="feedback-box"><div class="fb-label">Feedback Admin</div>${a.feedback}</div>`
            : '';

        const fotoGallery = a.fotoPaths && a.fotoPaths.length > 0
            ? `<div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
                ${a.fotoPaths.map(path => `<img src="${path}" style="width:70px; height:70px; object-fit:cover; border-radius:6px; cursor:pointer; border:1px solid var(--border);" onclick="openFullImage('${path}')">`).join('')}
               </div>`
            : '';

        html += `<div class="aspirasi-card">
            <div class="card-top">
                <div class="card-title">Aspirasi #${a.id}</div>
                ${badge}
            </div>
            <div class="aspirasi-text">${a.isiAspirasi}</div>
            ${fotoGallery}
            <div class="meta-row" style="margin-top:12px">
                <div class="meta-item"><strong>Kategori:</strong> ${a.kategori?.namaKategori || '—'}</div>
                <div class="meta-item"><strong>Dikirim:</strong> ${formatTgl(a.tanggal)}</div>
                <div class="meta-item"><strong>Anonim:</strong> ${a.anonim ? 'Ya' : 'Tidak'}</div>
            </div>
            ${feedback}
        </div>`;
    });
    document.getElementById("listRiwayat").innerHTML = html;
}

loadRiwayat();
</script>
</body>
</html>
