<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe — Riwayat Aspirasi</title>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root{
            --ink:#0d0d0d;
            --paper:#f7f4ee;
            --accent:#ff4d2e;
            --accent2:#1a1aff;
            --muted:#8f8f82;
            --border:#e3dfd6;
            --card:#ffffff;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'DM Sans',sans-serif;
            background:var(--paper);
            color:var(--ink);
            min-height:100vh;
            overflow-x:hidden;
        }

        body::before{
            content:'';
            position:fixed;
            inset:0;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255,77,46,0.07) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(26,26,255,0.06) 0%, transparent 40%);
            pointer-events:none;
            z-index:0;
        }

        body::after{
            content:'';
            position:fixed;
            inset:0;
            background-image:
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size:28px 28px;
            pointer-events:none;
            z-index:0;
        }

        /* NAVBAR */

        nav{
            position:sticky;
            top:0;
            z-index:100;
            height:64px;
            padding:0 2rem;
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(13,13,13,0.82);
            backdrop-filter:blur(14px);
            border-bottom:1px solid rgba(255,255,255,0.05);
        }

        .nav-brand{
            font-family:'Syne',sans-serif;
            font-size:1.4rem;
            font-weight:800;
            color:white;
            text-decoration:none;
            letter-spacing:-0.04em;
        }

        .nav-brand span{
            color:var(--accent);
        }

        .nav-links{
            display:flex;
            align-items:center;
            gap:.25rem;
            list-style:none;
        }

        .nav-links a{
            text-decoration:none;
            color:#999;
            font-size:.84rem;
            padding:.45rem .8rem;
            border-radius:8px;
            transition:.2s;
        }

        .nav-links a:hover,
        .nav-links a.active{
            background:rgba(255,255,255,0.08);
            color:white;
        }

        .nav-links a.active{
            color:var(--accent);
        }

        .nav-right{
            display:flex;
            align-items:center;
            gap:1rem;
        }

        .nav-greeting{
            font-size:.82rem;
            color:#777;
        }

        .nav-greeting strong{
            color:white;
            font-weight:500;
        }

        .btn-logout{
            border:none;
            background:var(--accent);
            color:var(--ink);
            font-family:'Syne',sans-serif;
            font-size:.72rem;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:.08em;
            padding:.55rem 1rem;
            border-radius:8px;
            cursor:pointer;
            transition:.2s;
        }

        .btn-logout:hover{
            transform:translateY(-2px);
            opacity:.9;
        }

        /* MAIN */

        main{
            position:relative;
            z-index:1;
            max-width:950px;
            margin:auto;
            padding:4rem 1.5rem 5rem;
        }

        .page-header{
            margin-bottom:3rem;
            animation:fadeUp .5s ease forwards;
        }

        .page-eyebrow{
            font-family:'Syne',sans-serif;
            font-size:.72rem;
            font-weight:800;
            letter-spacing:.15em;
            text-transform:uppercase;
            color:var(--accent);
            margin-bottom:.8rem;
            display:flex;
            align-items:center;
            gap:.5rem;
        }

        .page-eyebrow::before{
            content:'';
            width:24px;
            height:2px;
            background:var(--accent);
        }

        .page-title{
            font-family:'Syne',sans-serif;
            font-size:clamp(2.5rem,6vw,4.5rem);
            line-height:1;
            letter-spacing:-0.05em;
            font-weight:800;
        }

        .page-title em{
            color:var(--accent2);
            font-style:normal;
        }

        .page-subtitle{
            margin-top:1rem;
            max-width:520px;
            color:var(--muted);
            line-height:1.8;
            font-size:.96rem;
            font-weight:300;
        }

        /* CARD */

        .history-card{
            position:relative;
            background:rgba(255,255,255,0.82);
            backdrop-filter:blur(12px);
            border:1.5px solid var(--border);
            border-radius:24px;
            padding:2rem;
            overflow:hidden;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.05),
                0 2px 10px rgba(0,0,0,0.04);
            margin-bottom:1.5rem;
            animation:fadeUp .5s ease forwards;
        }

        .history-card::before{
            content:'';
            position:absolute;
            top:0;
            left:0;
            right:0;
            height:3px;
            background:linear-gradient(
                90deg,
                var(--accent),
                var(--accent2)
            );
        }

        .history-top{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:1rem;
            margin-bottom:1.4rem;
        }

        .history-title{
            font-family:'Syne',sans-serif;
            font-size:1.15rem;
            font-weight:700;
            letter-spacing:-0.02em;
        }

        .history-date{
            margin-top:.4rem;
            font-size:.78rem;
            color:var(--muted);
        }

        /* STATUS */

        .status{
            padding:.6rem 1rem;
            border-radius:999px;
            font-size:.75rem;
            font-weight:700;
            letter-spacing:.04em;
            text-transform:uppercase;
            white-space:nowrap;
        }

        .status-diproses{
            background:#fff1cc;
            color:#946200;
        }

        .status-selesai{
            background:#dff7e8;
            color:#18794e;
        }

        .status-ditolak{
            background:#ffe2e2;
            color:#c62828;
        }

        /* CONTENT */

        .history-content{
            line-height:1.9;
            color:#222;
            font-size:.95rem;
            white-space:pre-wrap;
        }

        .divider{
            height:1px;
            background:var(--border);
            margin:1.5rem 0;
        }

        .meta-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:1rem;
        }

        .meta-box{
            background:var(--paper);
            border:1px solid var(--border);
            border-radius:18px;
            padding:1rem 1.1rem;
        }

        .meta-label{
            font-family:'Syne',sans-serif;
            font-size:.68rem;
            font-weight:700;
            letter-spacing:.12em;
            text-transform:uppercase;
            color:var(--muted);
            margin-bottom:.6rem;
        }

        .meta-value{
            color:#222;
            line-height:1.7;
            font-size:.92rem;
        }

        /* EMPTY */

        .empty-state{
            position:relative;
            background:rgba(255,255,255,0.82);
            backdrop-filter:blur(12px);
            border:1.5px solid var(--border);
            border-radius:24px;
            padding:4rem 2rem;
            text-align:center;
            overflow:hidden;
        }

        .empty-title{
            font-family:'Syne',sans-serif;
            font-size:1.5rem;
            margin-bottom:.8rem;
            letter-spacing:-0.03em;
        }

        .empty-desc{
            color:var(--muted);
            line-height:1.8;
            max-width:420px;
            margin:auto;
        }

        /* BLOB */

        .blob{
            position:fixed;
            border-radius:50%;
            filter:blur(90px);
            opacity:.16;
            pointer-events:none;
            z-index:0;
        }

        .blob1{
            width:260px;
            height:260px;
            background:var(--accent);
            top:-80px;
            right:-80px;
        }

        .blob2{
            width:240px;
            height:240px;
            background:var(--accent2);
            bottom:-100px;
            left:-80px;
        }

        @keyframes fadeUp{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @media(max-width:768px){

            nav{
                padding:0 1rem;
            }

            .nav-links{
                display:none;
            }

            main{
                padding:2.5rem 1rem 4rem;
            }

            .history-card{
                padding:1.5rem;
                border-radius:20px;
            }

            .history-top{
                flex-direction:column;
                align-items:flex-start;
            }

            .meta-grid{
                grid-template-columns:1fr;
            }

            .page-title{
                font-size:3rem;
            }

        }

    </style>
</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
    window.location.href = "/login.html";
}

if(user.role === "ADMIN"){
    window.location.href = "/admin.html";
}

window.onload = function(){

    const namaElements =
        document.querySelectorAll(".namaUser");

    namaElements.forEach(el => {
        el.innerText = user.nama;
    });
}

</script>

<nav>

    <a href="#" class="nav-brand">
        Tell<span>Me</span>
    </a>

    <ul class="nav-links">

        <li>
            <a href="/index.html">
                Beranda
            </a>
        </li>

        <li>
            <a href="/aspirasi.html">
                Buat Aspirasi
            </a>
        </li>

        <li>
            <a href="/forum.html">
                Forum
            </a>
        </li>

        <li>
            <a href="/riwayat.html" class="active">
                Riwayat
            </a>
        </li>

        <li>
            <a href="/profile.html">
                Profile
            </a>
        </li>

    </ul>

    <div class="nav-right">

        <span class="nav-greeting">
            Halo,
            <strong class="namaUser"></strong>
        </span>

        <button
            class="btn-logout"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>

<main>

    <div class="page-header">

        <div class="page-eyebrow">
            Aktivitas Aspirasi
        </div>

        <h1 class="page-title">
            Riwayat<br>
            <em>Aspirasi</em>
        </h1>

        <p class="page-subtitle">
            Pantau semua aspirasi yang pernah kamu kirim beserta status dan feedback dari admin kampus.
        </p>

    </div>

    <div id="listRiwayat"></div>

</main>

<script>

const API =
    "http://localhost:8080/api/aspirasi";

function logout(){

    localStorage.removeItem("user");

    window.location.href = "/login.html";
}

async function loadRiwayat(){

    const res = await fetch(API);

    let data = await res.json();

    data = data.filter(a => a.user?.id == user.id);

    let html = "";

    if(data.length === 0){

        html = `

        <div class="empty-state">

            <h3 class="empty-title">
                Belum Ada Aspirasi
            </h3>

            <p class="empty-desc">
                Kamu belum pernah mengirim aspirasi. Mulai sampaikan kritik, saran, atau ide untuk kampus sekarang juga.
            </p>

        </div>

        `;

        document.getElementById("listRiwayat")
            .innerHTML = html;

        return;
    }

    data.reverse().forEach(a => {

        let statusBadge = "";

        if(a.status?.id == 1){

            statusBadge =
                `<span class="status status-diproses">
                    Diproses
                </span>`;
        }

        if(a.status?.id == 2){

            statusBadge =
                `<span class="status status-selesai">
                    Selesai
                </span>`;
        }

        if(a.status?.id == 3){

            statusBadge =
                `<span class="status status-ditolak">
                    Ditolak
                </span>`;
        }

        html += `

        <div class="history-card">

            <div class="history-top">

                <div>

                    <div class="history-title">
                        Aspirasi Mahasiswa
                    </div>

                    <div class="history-date">
                        ${formatTanggal(a.tanggal)}
                    </div>

                </div>

                ${statusBadge}

            </div>

            <div class="history-content">
                ${a.isiAspirasi}
            </div>

            <div class="divider"></div>

            <div class="meta-grid">

                <div class="meta-box">

                    <div class="meta-label">
                        Kategori
                    </div>

                    <div class="meta-value">
                        ${a.kategori?.namaKategori || '-'}
                    </div>

                </div>

                <div class="meta-box">

                    <div class="meta-label">
                        Feedback Admin
                    </div>

                    <div class="meta-value">
                        ${a.feedback || 'Belum ada feedback'}
                    </div>

                </div>

            </div>

        </div>

        `;
    });

    document.getElementById("listRiwayat")
        .innerHTML = html;
}

function formatTanggal(tanggal){

    return new Date(tanggal)
        .toLocaleString("id-ID");
}

loadRiwayat();

</script>

</body>
</html>
