<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TellMe — Register</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#f6f4ef;
    --card:rgba(255,255,255,0.75);
    --line:#e8e3d8;
    --text:#111111;
    --muted:#77776c;

    --accent:#ff5a36;
    --accent2:#2a4bff;

    --shadow:
        0 10px 30px rgba(0,0,0,0.06),
        0 2px 10px rgba(0,0,0,0.04);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'DM Sans',sans-serif;
    min-height:100vh;
    background:var(--bg);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    color:var(--text);
}

/* grid background */

body::before{
    content:'';
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(rgba(0,0,0,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,.03) 1px, transparent 1px);

    background-size:32px 32px;
}

/* glow */

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.18;
    pointer-events:none;
}

.glow.one{
    width:300px;
    height:300px;
    background:var(--accent);
    top:-120px;
    right:-100px;
}

.glow.two{
    width:280px;
    height:280px;
    background:var(--accent2);
    bottom:-120px;
    left:-100px;
}

/* wrapper */

.register-wrapper{
    width:100%;
    max-width:460px;
    padding:1.2rem;
    position:relative;
    z-index:10;
}

/* card */

.register-card{
    position:relative;

    background:var(--card);
    backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,0.5);

    border-radius:30px;

    padding:2.7rem;

    box-shadow:var(--shadow);

    overflow:hidden;

    animation:fadeUp .6s ease;
}

.register-card::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:4px;

    background:linear-gradient(
        90deg,
        var(--accent),
        var(--accent2)
    );
}

/* deco number */

.corner-number{
    position:absolute;
    top:1.2rem;
    right:1.5rem;

    font-family:'Syne',sans-serif;
    font-size:5rem;
    font-weight:800;

    color:#ece7dc;

    line-height:1;
    letter-spacing:-0.06em;
}

/* logo */

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:.3rem;

    margin-bottom:.8rem;

    font-family:'Syne',sans-serif;
    font-size:2rem;
    font-weight:800;
    letter-spacing:-0.05em;
}

.logo span{
    color:var(--accent);
}

.subtitle{
    text-align:center;
    color:var(--muted);

    line-height:1.7;
    font-size:.95rem;

    margin-bottom:2.2rem;
}

/* form */

.form-group{
    margin-bottom:1.15rem;
}

.label{
    display:block;

    margin-bottom:.65rem;

    font-size:.72rem;
    font-weight:700;

    text-transform:uppercase;
    letter-spacing:.14em;

    font-family:'Syne',sans-serif;

    color:var(--muted);
}

.input{
    width:100%;

    padding:1rem 1rem 1rem 1.05rem;

    border-radius:16px;

    border:1.5px solid var(--line);

    background:rgba(255,255,255,.7);

    outline:none;

    font-size:.95rem;

    transition:.25s ease;

    color:var(--text);
}

.input::placeholder{
    color:#b1b1aa;
}

.input:hover{
    border-color:#d5d0c5;
}

.input:focus{
    border-color:var(--accent2);

    background:white;

    box-shadow:
        0 0 0 4px rgba(42,75,255,.08);
}

/* button */

.register-btn{
    width:100%;

    margin-top:.6rem;

    border:none;
    outline:none;

    padding:1rem;

    border-radius:16px;

    cursor:pointer;

    position:relative;
    overflow:hidden;

    font-family:'Syne',sans-serif;
    font-size:.95rem;
    font-weight:700;

    color:white;

    background:#111;

    transition:.3s ease;

    box-shadow:
        0 12px 25px rgba(0,0,0,.12);
}

.register-btn::before{
    content:'';

    position:absolute;
    inset:0;

    background:linear-gradient(
        90deg,
        var(--accent),
        var(--accent2)
    );

    opacity:0;

    transition:.35s;
}

.register-btn span{
    position:relative;
    z-index:2;
}

.register-btn:hover{
    transform:translateY(-3px);
}

.register-btn:hover::before{
    opacity:1;
}

/* message */

.message{
    min-height:22px;

    text-align:center;

    margin-top:1rem;

    font-size:.86rem;
}

/* footer */

.footer{
    margin-top:2rem;

    text-align:center;

    color:var(--muted);

    font-size:.92rem;
}

.footer a{
    color:var(--accent2);

    text-decoration:none;

    font-weight:700;
}

.footer a:hover{
    opacity:.7;
}

/* animation */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* mobile */

@media(max-width:480px){

    .register-card{
        padding:2rem 1.4rem;
        border-radius:24px;
    }

    .logo{
        font-size:1.7rem;
    }

    .corner-number{
        font-size:4rem;
    }

}

</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="register-wrapper">

    <div class="register-card">

        <div class="corner-number">
            02
        </div>

        <div class="logo">
            Tell<span>Me</span>
        </div>

        <p class="subtitle">
            Buat akun untuk mulai berdiskusi dan menyampaikan aspirasi kampus secara modern dan terbuka.
        </p>

        <div class="form-group">

            <label class="label">
                Nama Lengkap
            </label>

            <input
                type="text"
                id="nama"
                class="input"
                placeholder="Masukkan nama lengkap">

        </div>

        <div class="form-group">

            <label class="label">
                NIM
            </label>

            <input
                type="text"
                id="nim"
                class="input"
                placeholder="Masukkan NIM">

        </div>

        <div class="form-group">

            <label class="label">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="input"
                placeholder="Masukkan email">

        </div>

        <div class="form-group">

            <label class="label">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="input"
                placeholder="Masukkan password">

        </div>

        <button
            class="register-btn"
            onclick="register()">

            <span>
                Register
            </span>

        </button>

        <p
            id="message"
            class="message">
        </p>

        <div class="footer">

            Sudah punya akun?

            <a href="/login.html">
                Login
            </a>

        </div>

    </div>

</div>

<script>

const API =
    "http://localhost:8080/api/users";

async function register(){

    const nama =
        document.getElementById("nama").value;

    const nim =
        document.getElementById("nim").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if(!nama || !nim || !email || !password){

        message.innerHTML =
            "<span style='color:#ff5a36'>Lengkapi semua data</span>";

        return;
    }

    try{

        const res = await fetch(API,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                nama:nama,
                nim:nim,
                email:email,
                password:password,
                role:"MAHASISWA"

            })

        });

        if(!res.ok){

            throw new Error();

        }

        message.innerHTML =
            "<span style='color:#22a06b'>Register berhasil</span>";

        setTimeout(() => {

            window.location.href =
                "/login.html";

        },1500);

    }catch(err){

        message.innerHTML =
            "<span style='color:#ff5a36'>Email sudah digunakan</span>";

    }

}

</script>

</body>
</html>
