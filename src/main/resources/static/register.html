<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TellMe</title>
    <script src="/js/auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#0f1f3d; --teal:#0e9f8e; --teal-light:#12b5a2; --cream:#f7f6f2; --muted:#6b7280; --border:#e5e7eb; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'DM Sans',sans-serif; background:var(--cream); min-height:100vh; display:flex; }
        .left-panel {
            width:42%; background:var(--navy);
            display:flex; flex-direction:column; justify-content:center; padding:60px 56px;
            position:relative; overflow:hidden;
        }
        .left-panel::before { content:''; position:absolute; top:-80px; right:-80px; width:320px; height:320px; border:1px solid rgba(255,255,255,0.06); border-radius:50%; }
        .left-panel::after { content:''; position:absolute; bottom:-60px; left:-60px; width:240px; height:240px; border:1px solid rgba(14,159,142,0.2); border-radius:50%; }
        .brand-logo { font-family:'Sora',sans-serif; font-size:2.4rem; font-weight:700; color:#fff; letter-spacing:-0.02em; margin-bottom:6px; }
        .brand-logo span { color:var(--teal); }
        .brand-tagline { color:rgba(255,255,255,0.45); font-size:0.9rem; margin-bottom:40px; }
        .steps { list-style:none; }
        .steps li { display:flex; align-items:center; gap:14px; color:rgba(255,255,255,0.6); font-size:0.88rem; margin-bottom:18px; }
        .step-num { width:28px; height:28px; border-radius:50%; background:rgba(14,159,142,0.2); color:var(--teal); font-family:'Sora',sans-serif; font-weight:700; font-size:0.78rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .right-panel { flex:1; display:flex; align-items:center; justify-content:center; padding:40px; }
        .reg-box { width:100%; max-width:420px; }
        .reg-box h2 { font-family:'Sora',sans-serif; font-size:1.85rem; font-weight:700; color:var(--navy); margin-bottom:6px; letter-spacing:-0.02em; }
        .reg-box .subtitle { color:var(--muted); font-size:0.88rem; margin-bottom:28px; }
        .form-label { font-size:0.78rem; font-weight:500; color:var(--navy); margin-bottom:6px; letter-spacing:0.05em; text-transform:uppercase; display:block; }
        .form-control { border:1.5px solid var(--border); border-radius:10px; padding:11px 16px; font-size:0.93rem; color:var(--navy); background:#fff; width:100%; transition:border-color 0.2s,box-shadow 0.2s; }
        .form-control:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,159,142,0.12); outline:none; }
        .mb-3 { margin-bottom:1rem; }
        .btn-reg { background:var(--teal); color:#fff; border:none; border-radius:10px; padding:13px; font-family:'Sora',sans-serif; font-weight:600; font-size:0.93rem; width:100%; cursor:pointer; transition:background 0.2s,transform 0.1s; }
        .btn-reg:hover { background:var(--teal-light); transform:translateY(-1px); }
        .login-link { text-align:center; font-size:0.87rem; color:var(--muted); margin-top:20px; }
        .login-link a { color:var(--teal); font-weight:600; text-decoration:none; }
        #message { font-size:0.84rem; text-align:center; margin-top:12px; min-height:20px; }
        @media (max-width:768px) { .left-panel { display:none; } .right-panel { padding:24px; } }
    </style>
</head>
<body>
<div class="left-panel">
    <div class="brand-logo">Tell<span>Me</span></div>
    <p class="brand-tagline">Platform aspirasi & diskusi kampus</p>
    <ul class="steps">
        <li><span class="step-num">1</span> Isi data diri kamu dengan benar</li>
        <li><span class="step-num">2</span> Gunakan email kampus yang aktif</li>
        <li><span class="step-num">3</span> Mulai sampaikan aspirasi & diskusi</li>
    </ul>
</div>
<div class="right-panel">
    <div class="reg-box">
        <h2>Buat Akun</h2>
        <p class="subtitle">Daftar dan mulai gunakan TellMe</p>
        <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" id="nama" class="form-control" placeholder="Nama lengkap kamu">
        </div>
        <div class="mb-3">
            <label class="form-label">NIM</label>
            <input type="text" id="nim" class="form-control" placeholder="Nomor Induk Mahasiswa">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="email@mhs.ac.id">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Min. 8 karakter">
        </div>
        <button class="btn-reg" onclick="register()">Daftar Sekarang</button>
        <p id="message"></p>
        <div class="login-link">Sudah punya akun? <a href="/login.html">Masuk di sini</a></div>
    </div>
</div>
<script>
const API = "http://localhost:8080/api/users";
async function register() {
    const nama=document.getElementById("nama").value, nim=document.getElementById("nim").value,
          email=document.getElementById("email").value, password=document.getElementById("password").value;
    const msg = document.getElementById("message");
    if (!nama||!nim||!email||!password) { msg.innerHTML="<span style='color:#dc2626'>Lengkapi semua data</span>"; return; }
    try {
        const res = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({nama,nim,email,password,role:"MAHASISWA"}) });
        if (!res.ok) throw new Error();
        msg.innerHTML="<span style='color:#0e9f8e'>Registrasi berhasil! Mengarahkan ke login...</span>";
        setTimeout(() => { window.location.href="/login.html"; }, 1500);
    } catch { msg.innerHTML="<span style='color:#dc2626'>Email sudah digunakan</span>"; }
}
</script>
</body>
</html>
