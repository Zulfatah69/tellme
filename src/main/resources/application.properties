# =============================================================================
# TellMe Application Configuration
# =============================================================================
# Copy this file to application-local.properties for local overrides.
# NEVER commit real credentials to version control.
# See application-example.properties for documentation of all properties.
# =============================================================================

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tellme_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# --- Email (SMTP) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Email Routing (Category → Recipient) ---
tellme.mail.routing.organisasi=${MAIL_ROUTING_ORGANISASI:admin@example.com}
tellme.mail.routing.akademik=${MAIL_ROUTING_AKADEMIK:academic@example.com}
tellme.mail.from=${MAIL_FROM:${spring.mail.username}}

# --- File Upload ---
tellme.upload.dir=${UPLOAD_DIR:uploads}
tellme.upload.max-files=${UPLOAD_MAX_FILES:5}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

# --- Server ---
server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=native

# --- Security: Error Exposure ---
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Async (for email sending) ---
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=tellme-async-

# --- CORS ---
# Comma-separated list of allowed origins. Use * (not recommended in production).
# Example production value: https://yourdomain.ac.id
tellme.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# --- Flyway (Database Migrations) ---
# Disabled by default to maintain backward compatibility with existing installations.
#
# NEW INSTALLATIONS (no existing database):
#   Set spring.flyway.enabled=true and spring.jpa.hibernate.ddl-auto=validate
#   Flyway will create all tables from V1__initial_schema.sql automatically.
#
# EXISTING INSTALLATIONS (Hibernate already created the schema):
#   Set spring.flyway.enabled=true
#   Set spring.flyway.baseline-on-migrate=true (treats existing schema as V0 baseline)
#   Set spring.flyway.baseline-version=0
#   Flyway will skip V1 and only apply future migrations.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}
spring.flyway.locations=classpath:db/migration

# --- OpenAPI / Swagger UI ---
# Interactive API docs available at: http://localhost:{server.port}/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
# Disable Swagger in production by setting: springdoc.api-docs.enabled=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}